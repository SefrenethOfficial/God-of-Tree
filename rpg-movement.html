<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Top-Down RPG — Movement</title>
<style>
  :root {
    --grass-1: #3f6b3a;
    --grass-2: #4a7a44;
    --path: #b89b6a;
    --water: #3a6ea5;
    --tree: #2c4a29;
    --tree-trunk: #4a3221;
    --panel-bg: #1b1410;
    --panel-border: #6b4a2f;
    --ink: #f4ead9;
    --accent: #e0a458;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0e0b08;
    overflow: hidden;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }
  #gameWrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: var(--grass-1);
    image-rendering: pixelated;
    box-shadow: 0 0 0 4px var(--panel-border), 0 0 40px rgba(0,0,0,0.6);
    max-width: 100%;
    max-height: 100%;
    cursor: none;
  }
  #hud {
    position: absolute;
    top: 14px;
    left: 14px;
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--ink);
    font-size: 13px;
    line-height: 1.5;
    pointer-events: none;
    opacity: 0.92;
  }
  #hud b { color: var(--accent); }
  #coords {
    position: absolute;
    bottom: 14px;
    left: 14px;
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--ink);
    font-size: 12px;
    font-family: 'Consolas', monospace;
    opacity: 0.85;
  }
  #hint {
    position: absolute;
    bottom: 14px;
    right: 14px;
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--ink);
    font-size: 12px;
    opacity: 0.85;
    max-width: 220px;
  }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game" width="768" height="576"></canvas>
  <div id="hud"><b>WASD</b> or <b>Arrow Keys</b> to move<br>Mouse to aim, <b>Click</b> to shoot<br><b>Shift</b> to run</div>
  <div id="coords">tile: (0, 0)</div>
  <div id="hint">Enemies drop Mana (◆) — spend it in the shop between waves. Check the Equipment tab for the Arcade Ball: a risky Mana-boosting pong ball you can equip.</div>
</div>

// --- Simple tile map: 0 grass, 1 grass variant, 2 path, 3 water, 4 tree ---
function generateMap() {
  const map = [];
  for (let y = 0; y < MAP_H; y++) {
    const row = [];
    for (let x = 0; x < MAP_W; x++) {
      let tile = (Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1;
      tile = Math.abs(tile);
      row.push(tile > 0.88 ? 1 : 0);
    }
    map.push(row);
  }
  let px = 2, py = Math.floor(MAP_H / 2);
  for (let i = 0; i < MAP_W - 4; i++) {
    map[py][px] = 2;
    if (px + 1 < MAP_W) map[py][px + 1] = 2;
    if (Math.random() < 0.3 && py > 2) py--;
    else if (Math.random() < 0.3 && py < MAP_H - 3) py++;
    px++;
  }
  const pondX = 28, pondY = 10;
  for (let y = -2; y <= 2; y++) {
    for (let x = -3; x <= 3; x++) {
      if (x * x + y * y * 1.8 < 9) map[pondY + y][pondX + x] = 3;
    }
  }
  for (let i = 0; i < 140; i++) {
    const x = Math.floor(Math.random() * MAP_W);
    const y = Math.floor(Math.random() * MAP_H);
    if (map[y][x] === 0 || map[y][x] === 1) {
      if (Math.random() < 0.5) map[y][x] = 4;
    }
  }
  return map;
}
const world = generateMap();

function isBlocked(tileX, tileY) {
  if (tileX < 0 || tileY < 0 || tileX >= MAP_W || tileY >= MAP_H) return true;
  const t = world[tileY][tileX];
  return t === 3 || t === 4;
}
function isWalkable(tileX, tileY) {
  if (tileX < 0 || tileY < 0 || tileX >= MAP_W || tileY >= MAP_H) return false;
  const t = world[tileY][tileX];
  return t === 0 || t === 1 || t === 2;
}

const mouse = { x: canvas.width / 2, y: canvas.height / 2 };
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  mouse.x = (e.clientX - rect.left) * scaleX;
  mouse.y = (e.clientY - rect.top) * scaleY;
});

let wantsToShoot = false;
canvas.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  if (waveState === 'intermission') {
    handleShopClick(mouse.x, mouse.y);
    return;
  }
  wantsToShoot = true;
});
window.addEventListener('mouseup', e => {
  if (e.button === 0) wantsToShoot = false;
});

function getInputVector() {
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  return { dx, dy };
}

function canMoveTo(nx, ny) {
  const halfW = player.w / 2 - 2;
  const halfH = player.h / 2 - 2;
  const corners = [
    [nx - halfW, ny - halfH],
    [nx + halfW, ny - halfH],
    [nx - halfW, ny + halfH],
    [nx + halfW, ny + halfH]
  ];
  for (const [cx, cy] of corners) {
    const tx = Math.floor(cx / TILE);
    const ty = Math.floor(cy / TILE);
    if (isBlocked(tx, ty)) return false;
  }
  return true;
}

// --- Bullets ---
const bullets = [];
let BULLET_SPEED = 420;
const BULLET_RADIUS = 6.5;
let BULLET_DAMAGE = 20;
let BULLETS_PER_SHOT = 5;
let FIRE_COOLDOWN = 0.35; // seconds between shots while holding the mouse button
const SPREAD_ANGLE = 0.5;
let fireTimer = 0;

function dirToAngle(dir) {
  switch (dir) {
    case 'right': return 0;
    case 'down': return Math.PI / 2;
    case 'left': return Math.PI;
    case 'up': return -Math.PI / 2;
    default: return 0;
  }
}

function aimAngle() {
  return Math.atan2(mouse.y - canvas.height / 2, mouse.x - canvas.width / 2);
}

function fireShotgun() {
  const baseAngle = aimAngle();
  for (let i = 0; i < BULLETS_PER_SHOT; i++) {
    const spread = (i - (BULLETS_PER_SHOT - 1) / 2) * (SPREAD_ANGLE / (BULLETS_PER_SHOT - 1));
    const angle = baseAngle + spread + (Math.random() - 0.5) * 0.06;
    bullets.push({
      x: player.x,
      y: player.y - 8,
      vx: Math.cos(angle) * BULLET_SPEED * (0.85 + Math.random() * 0.3),
      vy: Math.sin(angle) * BULLET_SPEED * (0.85 + Math.random() * 0.3),
      life: 0.9
    });
  }
}

// --- Enemies & Waves ---
const enemies = [];
const ENEMY_MAX_HP = 50;
const ENEMY_RADIUS = 12;
const ENEMY_CHASE_SPEED = 55;
const ENEMY_WANDER_SPEED = 20;
const ENEMY_AGGRO_RANGE = 220;
const ENEMY_CONTACT_DAMAGE = 8;
const ENEMY_CONTACT_COOLDOWN = 0.6;
const respawnQueue = [];

// wave state
let wave = 1;
let killsThisWave = 0;
let killsRequired = waveKillsRequired(wave);
let waveState = 'active';       // 'active' | 'intermission'
const WAVE_INTERMISSION = 25;   // seconds between waves — gives shopping time
let intermissionTimer = 0;
let waveBanner = null;          // { title, sub, timer, fadeTotal }

function waveKillsRequired(w) {
  return 5 + w * 3; // wave 1 = 8, wave 2 = 11, wave 3 = 14, ...
}
function waveConcurrentCap(w) {
  return Math.min(12 + w * 2, 28); // wave 1 = 14 enemies on screen at once — a real swarm
}

function findWalkableTile() {
  for (let attempts = 0; attempts < 200; attempts++) {
    const tx = Math.floor(Math.random() * MAP_W);
    const ty = Math.floor(Math.random() * MAP_H);
    if (isWalkable(tx, ty)) {
      const wx = tx * TILE + TILE / 2;
      const wy = ty * TILE + TILE / 2;
      if (Math.hypot(wx - SPAWN_X, wy - SPAWN_Y) > 5 * TILE) {
        return { x: wx, y: wy };
      }
    }
  }
  return { x: 10 * TILE, y: 10 * TILE };
}

function spawnEnemy() {
  const pos = findWalkableTile();
  enemies.push({
    x: pos.x,
    y: pos.y,
    hp: ENEMY_MAX_HP,
    maxHp: ENEMY_MAX_HP,
    radius: ENEMY_RADIUS,
    wanderAngle: Math.random() * Math.PI * 2,
    wanderTimer: Math.random() * 2,
    touchCooldown: 0,
    hitFlash: 0
  });
}

function startWave(w) {
  wave = w;
  killsThisWave = 0;
  killsRequired = waveKillsRequired(wave);
  waveState = 'active';
  respawnQueue.length = 0;
  const cap = waveConcurrentCap(wave);
  for (let i = 0; i < cap; i++) spawnEnemy();
  waveBanner = { title: `Wave ${wave}`, sub: `Kill ${killsRequired} enemies`, timer: 2, fadeTotal: 2 };
}
startWave(1);

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    if (e.hitFlash > 0) e.hitFlash -= dt;
    if (e.touchCooldown > 0) e.touchCooldown -= dt;

    const dxp = player.x - e.x;
    const dyp = player.y - e.y;
    const distToPlayer = Math.hypot(dxp, dyp);

    let moveX = 0, moveY = 0, speed = ENEMY_WANDER_SPEED;
    if (distToPlayer < ENEMY_AGGRO_RANGE) {
      moveX = dxp / distToPlayer;
      moveY = dyp / distToPlayer;
      speed = ENEMY_CHASE_SPEED;
    } else {
      e.wanderTimer -= dt;
      if (e.wanderTimer <= 0) {
        e.wanderAngle = Math.random() * Math.PI * 2;
        e.wanderTimer = 1.5 + Math.random() * 2;
      }
      moveX = Math.cos(e.wanderAngle);
      moveY = Math.sin(e.wanderAngle);
    }

    const nx = e.x + moveX * speed * dt;
    const ny = e.y + moveY * speed * dt;
    const ntx = Math.floor(nx / TILE), nty = Math.floor(ny / TILE);
    if (!isBlocked(ntx, Math.floor(e.y / TILE))) e.x = nx;
    if (!isBlocked(Math.floor(e.x / TILE), nty)) e.y = ny;

    // contact damage with player
    if (distToPlayer < e.radius + player.hitRadius && e.touchCooldown <= 0 && player.invulnTimer <= 0) {
      player.health -= ENEMY_CONTACT_DAMAGE;
      player.invulnTimer = 0.4;
      e.touchCooldown = ENEMY_CONTACT_COOLDOWN;
    }

    if (e.hp <= 0) {
      spawnManaDrop(e.x, e.y);
      enemies.splice(i, 1);
      if (waveState === 'active') {
        killsThisWave++;
        if (killsThisWave >= killsRequired) {
          // wave cleared — sweep the board and start the intermission countdown
          waveState = 'intermission';
          intermissionTimer = WAVE_INTERMISSION;
          respawnQueue.length = 0;
          enemies.length = 0;
          waveBanner = {
            title: `Wave ${wave} Cleared!`,
            sub: `Shop is open`,
            timer: 2.2,
            fadeTotal: 2.2
          };
          break; // array is now empty — stop iterating over stale indices
        } else {
          respawnQueue.push(3 + Math.random() * 2);
        }
      }
    }
  }

  if (waveState === 'active') {
    for (let i = respawnQueue.length - 1; i >= 0; i--) {
      respawnQueue[i] -= dt;
      if (respawnQueue[i] <= 0 && enemies.length < waveConcurrentCap(wave)) {
        respawnQueue.splice(i, 1);
        spawnEnemy();
      }
    }
  } else if (waveState === 'intermission') {
    intermissionTimer -= dt;
    if (intermissionTimer <= 0) {
      startWave(wave + 1);
    }
  }

  if (waveBanner) {
    waveBanner.timer -= dt;
  }

  updateManaDrops(dt);
}

// --- Mana drops ---
const manaDrops = [];
const MANA_PICKUP_RADIUS = 20;
const MANA_DROP_LIFETIME = 20;

function spawnManaDrop(x, y) {
  const base = 4 + Math.floor(Math.random() * 4);
  const amount = pongEquipped ? Math.round(base * PONG_MANA_MULTIPLIER) : base;
  manaDrops.push({
    x, y,
    amount,
    age: 0,
    bob: Math.random() * Math.PI * 2
  });
}

function updateManaDrops(dt) {
  for (let i = manaDrops.length - 1; i >= 0; i--) {
    const m = manaDrops[i];
    m.age += dt;
    m.bob += dt * 3;
    const dist = Math.hypot(player.x - m.x, player.y - m.y);
    if (dist < MANA_PICKUP_RADIUS + player.hitRadius) {
      player.mana += m.amount;
      manaDrops.splice(i, 1);
      continue;
    }
    if (m.age > MANA_DROP_LIFETIME) {
      manaDrops.splice(i, 1);
    }
  }
}

function drawManaDrop(m, camX, camY) {
  const sx = Math.round(m.x - camX);
  const sy = Math.round(m.y - camY) + Math.sin(m.bob) * 3;
  const fadeOut = m.age > MANA_DROP_LIFETIME - 3 ? Math.max(0, (MANA_DROP_LIFETIME - m.age) / 3) : 1;

  ctx.save();
  ctx.globalAlpha = fadeOut;
  ctx.shadowColor = '#7ad9ff';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#8fe3ff';
  ctx.beginPath();
  ctx.moveTo(sx, sy - 6);
  ctx.lineTo(sx + 5, sy);
  ctx.lineTo(sx, sy + 6);
  ctx.lineTo(sx - 5, sy);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#e0f8ff';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();
}

// --- Upgrade shop (between waves) ---
const upgrades = { bullets: 0, bulletSpeed: 0, fireRate: 0, damage: 0, maxHealth: 0 };

const UPGRADE_DEFS = [
  {
    id: 'bullets',
    label: 'Extra Pellet',
    desc: () => `+1 bullet per shot`,
    baseCost: 10,
    costGrowth: 1.7,
    apply: () => { BULLETS_PER_SHOT += 1; }
  },
  {
    id: 'bulletSpeed',
    label: 'Bullet Speed',
    desc: () => `+15% bullet speed`,
    baseCost: 8,
    costGrowth: 1.55,
    apply: () => { BULLET_SPEED = Math.round(BULLET_SPEED * 1.15); }
  },
  {
    id: 'fireRate',
    label: 'Fire Rate',
    desc: () => `Faster reload`,
    baseCost: 10,
    costGrowth: 1.6,
    maxLevel: 6,
    apply: () => { FIRE_COOLDOWN = Math.max(0.12, FIRE_COOLDOWN * 0.85); }
  },
  {
    id: 'damage',
    label: 'Bullet Damage',
    desc: () => `+5 damage per bullet`,
    baseCost: 12,
    costGrowth: 1.65,
    apply: () => { BULLET_DAMAGE += 5; }
  },
  {
    id: 'maxHealth',
    label: 'Max Health',
    desc: () => `+20 max HP (heals too)`,
    baseCost: 9,
    costGrowth: 1.5,
    apply: () => { player.maxHealth += 20; player.health += 20; }
  }
];

function getUpgradeCost(def) {
  return Math.round(def.baseCost * Math.pow(def.costGrowth, upgrades[def.id]));
}

function tryBuyUpgrade(id) {
  const def = UPGRADE_DEFS.find(d => d.id === id);
  if (!def) return;
  if (def.maxLevel && upgrades[id] >= def.maxLevel) return;
  const cost = getUpgradeCost(def);
  if (player.mana >= cost) {
    player.mana -= cost;
    upgrades[id] += 1;
    def.apply();
  }
}

// small helper for wrapping the equipment description onto multiple lines
function wrapText(text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let cy = y;
  for (const word of words) {
    const test = line + word + ' ';
    if (ctx.measureText(test).width > maxWidth && line !== '') {
      ctx.fillText(line, x, cy);
      line = word + ' ';
      cy += lineHeight;
    } else {
      line = test;
    }
  }
  ctx.fillText(line, x, cy);
}

function handleShopClick(x, y) {
  for (const btn of shopButtonRects) {
    if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
      if (btn.action === 'startWave') {
        startWave(wave + 1);
      } else if (btn.action === 'buy') {
        tryBuyUpgrade(btn.upgradeId);
      } else if (btn.action === 'switchTab') {
        shopTab = btn.tab;
      } else if (btn.action === 'buyEquip') {
        const def = EQUIPMENT_DEFS.find(d => d.id === btn.equipId);
        if (def && !def.isOwned() && player.mana >= def.cost) {
          player.mana -= def.cost;
          def.buy();
        }
      } else if (btn.action === 'toggleEquip') {
        const def = EQUIPMENT_DEFS.find(d => d.id === btn.equipId);
        if (def && def.isOwned()) def.toggle();
      }
      break;
    }
  }
}


// --- Pong side-game (screen space) — an equippable shop item, not always active ---
const PONG_BASE_SPEED = 200;
const PONG_MAX_SPEED = 750;
const PONG_RAMP_DURATION = 10;
const PONG_BASE_RADIUS = 8;
const PONG_MAX_RADIUS = 34;
const PADDLE_W = 12;
const PADDLE_H = 90;
const PADDLE_INSET = 18;
const PADDLE_SPEED = 620;          // slower than before — paddles can't snap to the ball instantly
const PADDLE_REACTION_DELAY = 0.32; // seconds — paddles react to where the ball WAS, not where it is now

const paddleLeft = { y: canvas.height / 2 - PADDLE_H / 2 };
const paddleRight = { y: canvas.height / 2 - PADDLE_H / 2 };

// rolling history of the ball's y-position so paddles can track a "delayed" reading
let gameTime = 0;
const ballHistory = [];

function makeBall() {
  const angle = (Math.random() * 0.6 - 0.3) + (Math.random() < 0.5 ? 0 : Math.PI);
  return {
    x: canvas.width / 2,
    y: canvas.height / 2,
    dirX: Math.cos(angle),
    dirY: Math.sin(angle) || 0.3,
    age: 0
  };
}
let pongBall = makeBall();

function resetBall() {
  pongBall = makeBall();
  ballHistory.length = 0;
}

const PONG_EXPLOSION_BULLETS = 16;

function explodePongBall(camX, camY) {
  // convert the ball's screen position into world space so the fragments
  // travel and collide the same way normal player bullets do
  const worldX = pongBall.x + camX;
  const worldY = pongBall.y + camY;
  for (let i = 0; i < PONG_EXPLOSION_BULLETS; i++) {
    const angle = (i / PONG_EXPLOSION_BULLETS) * Math.PI * 2 + Math.random() * 0.15;
    const spd = BULLET_SPEED * (0.6 + Math.random() * 0.7);
    bullets.push({
      x: worldX,
      y: worldY,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 0.8
    });
  }
  resetBall();
}

function delayedBallY() {
  const targetT = gameTime - PADDLE_REACTION_DELAY;
  for (let i = 0; i < ballHistory.length; i++) {
    if (ballHistory[i].t >= targetT) return ballHistory[i].y;
  }
  return ballHistory.length ? ballHistory[0].y : pongBall.y;
}

function updatePong(dt) {
  gameTime += dt;
  pongBall.age += dt;
  const intensity = Math.min(pongBall.age / PONG_RAMP_DURATION, 1);
  const speed = PONG_BASE_SPEED + intensity * (PONG_MAX_SPEED - PONG_BASE_SPEED);
  const radius = PONG_BASE_RADIUS + intensity * (PONG_MAX_RADIUS - PONG_BASE_RADIUS);
  pongBall.radius = radius;
  pongBall.speed = speed;

  pongBall.x += pongBall.dirX * speed * dt;
  pongBall.y += pongBall.dirY * speed * dt;

  // record ball position for delayed paddle tracking
  ballHistory.push({ t: gameTime, y: pongBall.y });
  while (ballHistory.length > 1 && ballHistory[0].t < gameTime - 1) ballHistory.shift();

  // bounce top/bottom
  if (pongBall.y - radius < 0) {
    pongBall.y = radius;
    pongBall.dirY = Math.abs(pongBall.dirY);
  } else if (pongBall.y + radius > canvas.height) {
    pongBall.y = canvas.height - radius;
    pongBall.dirY = -Math.abs(pongBall.dirY);
  }

  // paddle AI tracking — chases a LAGGED reading of the ball's position, so it's
  // consistently a bit behind, especially once the ball speeds up
  const laggedY = delayedBallY();
  const targetL = laggedY - PADDLE_H / 2;
  paddleLeft.y += Math.max(-PADDLE_SPEED * dt, Math.min(PADDLE_SPEED * dt, targetL - paddleLeft.y));
  paddleLeft.y = Math.max(0, Math.min(canvas.height - PADDLE_H, paddleLeft.y));

  const targetR = laggedY - PADDLE_H / 2;
  paddleRight.y += Math.max(-PADDLE_SPEED * dt, Math.min(PADDLE_SPEED * dt, targetR - paddleRight.y));
  paddleRight.y = Math.max(0, Math.min(canvas.height - PADDLE_H, paddleRight.y));

  // bounce off left paddle (only if the lagging paddle actually got there in time)
  const leftPaddleX = PADDLE_INSET + PADDLE_W;
  if (pongBall.dirX < 0 && pongBall.x - radius <= leftPaddleX && pongBall.x - radius > PADDLE_INSET - 20 &&
      pongBall.y > paddleLeft.y - radius && pongBall.y < paddleLeft.y + PADDLE_H + radius) {
    pongBall.x = leftPaddleX + radius;
    pongBall.dirX = Math.abs(pongBall.dirX);
    const hitPos = (pongBall.y - (paddleLeft.y + PADDLE_H / 2)) / (PADDLE_H / 2);
    pongBall.dirY = Math.max(-0.85, Math.min(0.85, pongBall.dirY + hitPos * 0.4));
  }
  // bounce off right paddle
  const rightPaddleX = canvas.width - PADDLE_INSET - PADDLE_W;
  if (pongBall.dirX > 0 && pongBall.x + radius >= rightPaddleX && pongBall.x + radius < canvas.width - PADDLE_INSET + 20 &&
      pongBall.y > paddleRight.y - radius && pongBall.y < paddleRight.y + PADDLE_H + radius) {
    pongBall.x = rightPaddleX - radius;
    pongBall.dirX = -Math.abs(pongBall.dirX);
    const hitPos = (pongBall.y - (paddleRight.y + PADDLE_H / 2)) / (PADDLE_H / 2);
    pongBall.dirY = Math.max(-0.85, Math.min(0.85, pongBall.dirY + hitPos * 0.4));
  }

  // if the paddle missed entirely, the ball sails out of the arena — treat it as
  // a whiff and reset (no damage), instead of letting it fly through the middle
  if (pongBall.x < -radius - 40 || pongBall.x > canvas.width + radius + 40) {
    resetBall();
    return;
  }

  // normalize direction vector
  const dlen = Math.hypot(pongBall.dirX, pongBall.dirY) || 1;
  pongBall.dirX /= dlen;
  pongBall.dirY /= dlen;

  // collision with player (player sprite is always screen-centered)
  // note: ball always spawns at center, so we require a short grace period after
  // spawning before it's eligible to damage — otherwise every reset (including a
  // clean miss) could register as an instant hit before the ball moves away
  const px = canvas.width / 2, py = canvas.height / 2;
  const dist = Math.hypot(pongBall.x - px, pongBall.y - py);
  if (pongBall.age > 0.15 && dist < radius + player.hitRadius && player.invulnTimer <= 0) {
    player.health -= PONG_DAMAGE;
    player.invulnTimer = 1.2;
    resetBall();
  }
}

// --- Game loop ---
let lastTime = performance.now();
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

function update(dt) {
  if (player.invulnTimer > 0) player.invulnTimer -= dt;

  const { dx, dy } = getInputVector();
  const running = keys['shift'];
  const speed = running ? player.speedRun : player.speedWalk;

  let moveX = dx, moveY = dy;
  const len = Math.hypot(moveX, moveY);
  if (len > 0) {
    moveX /= len;
    moveY /= len;
    player.moving = true;
    if (Math.abs(dx) > Math.abs(dy)) {
      player.dir = dx > 0 ? 'right' : 'left';
    } else if (dy !== 0) {
      player.dir = dy > 0 ? 'down' : 'up';
    }
  } else {
    player.moving = false;
  }

  const nx = player.x + moveX * speed * dt;
  const ny = player.y + moveY * speed * dt;
  if (canMoveTo(nx, player.y)) player.x = nx;
  if (canMoveTo(player.x, ny)) player.y = ny;

  player.x = Math.max(TILE / 2, Math.min(MAP_W * TILE - TILE / 2, player.x));
  player.y = Math.max(TILE / 2, Math.min(MAP_H * TILE - TILE / 2, player.y));

  if (player.moving) {
    player.animTimer += dt * (running ? 10 : 7);
    player.animFrame = Math.floor(player.animTimer) % 4;
  } else {
    player.animTimer = 0;
    player.animFrame = 0;
  }

  document.getElementById('coords').textContent =
    `tile: (${Math.floor(player.x / TILE)}, ${Math.floor(player.y / TILE)})`;

  fireTimer -= dt;
  if (wantsToShoot && fireTimer <= 0 && waveState === 'active') {
    fireTimer = FIRE_COOLDOWN;
    fireShotgun();
  }

  // camera offset (world -> screen), needed to compare world-space bullets
  // against the screen-space pong ball
  const camX = player.x - canvas.width / 2;
  const camY = player.y - canvas.height / 2;

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;

    let hit = false;

    // did this bullet pop the pong ball? (grace period stops a freshly-spawned
    // ball — which always appears at your position, same as new bullets — from
    // being re-popped instantly and chain-exploding into an infinite cascade)
    const bScreenX = b.x - camX;
    const bScreenY = b.y - camY;
    if (pongEquipped && pongBall.age > 0.15 && Math.hypot(bScreenX - pongBall.x, bScreenY - pongBall.y) < pongBall.radius + BULLET_RADIUS) {
      explodePongBall(camX, camY);
      hit = true;
    }

    if (!hit) {
      for (const e of enemies) {
        if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + BULLET_RADIUS) {
          e.hp -= BULLET_DAMAGE;
          e.hitFlash = 0.15;
          hit = true;
          break;
        }
      }
    }

    const tx = Math.floor(b.x / TILE);
    const ty = Math.floor(b.y / TILE);
    if (hit || b.life <= 0 || isBlocked(tx, ty)) {
      bullets.splice(i, 1);
    }
  }

  // safety valve: never let bullets pile up without bound, no matter the cause
  const MAX_BULLETS = 300;
  if (bullets.length > MAX_BULLETS) {
    bullets.splice(0, bullets.length - MAX_BULLETS);
  }

  updateEnemies(dt);
  if (waveState === 'active' && pongEquipped) updatePong(dt);

  if (player.health <= 0) {
    player.health = player.maxHealth;
    player.x = SPAWN_X;
    player.y = SPAWN_Y;
    player.invulnTimer = 2.0;
  }
}

function tileColor(t) {
  switch (t) {
    case 0: return '#3f6b3a';
    case 1: return '#4a7a44';
    case 2: return '#b89b6a';
    case 3: return '#3a6ea5';
    case 4: return '#3f6b3a';
    default: return '#3f6b3a';
  }
}

function render() {
  const camX = Math.round(player.x - canvas.width / 2);
  const camY = Math.round(player.y - canvas.height / 2);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const startTX = Math.max(0, Math.floor(camX / TILE));
  const endTX = Math.min(MAP_W, Math.ceil((camX + canvas.width) / TILE) + 1);
  const startTY = Math.max(0, Math.floor(camY / TILE));
  const endTY = Math.min(MAP_H, Math.ceil((camY + canvas.height) / TILE) + 1);

  for (let ty = startTY; ty < endTY; ty++) {
    for (let tx = startTX; tx < endTX; tx++) {
      const t = world[ty][tx];
      const sx = tx * TILE - camX;
      const sy = ty * TILE - camY;
      ctx.fillStyle = tileColor(t);
      ctx.fillRect(sx, sy, TILE, TILE);
      if (t === 3) {
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(sx + 4, sy + 6, TILE - 8, 3);
      }
    }
  }

  const drawables = [];
  for (let ty = startTY; ty < endTY; ty++) {
    for (let tx = startTX; tx < endTX; tx++) {
      if (world[ty][tx] === 4) {
        drawables.push({ y: ty * TILE + TILE, draw: () => drawTree(tx * TILE - camX, ty * TILE - camY) });
      }
    }
  }
  for (const e of enemies) {
    drawables.push({ y: e.y, draw: () => drawEnemy(e, camX, camY) });
  }
  for (const m of manaDrops) {
    drawables.push({ y: m.y - 20, draw: () => drawManaDrop(m, camX, camY) });
  }
  drawables.push({ y: player.y + player.h / 2, draw: () => drawPlayer(camX, camY) });
  drawables.sort((a, b) => a.y - b.y);
  drawables.forEach(d => d.draw());

  drawBullets(camX, camY);
  if (pongEquipped) drawPong();
  drawHUD();
  drawWaveBanner();
  drawShop();
  drawCrosshair();
}

function drawTree(sx, sy) {
  ctx.fillStyle = '#4a3221';
  ctx.fillRect(sx + 13, sy + 20, 6, 10);
  ctx.fillStyle = '#2c4a29';
  ctx.beginPath();
  ctx.arc(sx + 16, sy + 12, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#375c33';
  ctx.beginPath();
  ctx.arc(sx + 11, sy + 8, 9, 0, Math.PI * 2);
  ctx.fill();
}

function drawEnemy(e, camX, camY) {
  const sx = Math.round(e.x - camX);
  const sy = Math.round(e.y - camY);

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(sx, sy + e.radius - 2, e.radius * 0.8, e.radius * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : '#8a2f3a';
  ctx.beginPath();
  ctx.arc(sx, sy, e.radius, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#1a0a0c';
  ctx.beginPath();
  ctx.arc(sx - 4, sy - 2, 2, 0, Math.PI * 2);
  ctx.arc(sx + 4, sy - 2, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#1a0a0c';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(sx, sy + 3, 4, 0, Math.PI);
  ctx.stroke();

  // health bar
  const barW = e.radius * 2;
  const pct = Math.max(0, e.hp / e.maxHp);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(sx - barW / 2, sy - e.radius - 10, barW, 4);
  ctx.fillStyle = '#e05a4f';
  ctx.fillRect(sx - barW / 2, sy - e.radius - 10, barW * pct, 4);
}

function drawPlayer(camX, camY) {
  const sx = Math.round(player.x - camX);
  const sy = Math.round(player.y - camY);
  const bob = player.moving ? Math.abs(Math.sin(player.animTimer * Math.PI)) * 2 : 0;

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(sx, sy + player.h / 2 - 2, 10, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  const bodyY = sy - bob;
  const SPRITE_SIZE = 30;

  const legSwing = player.moving ? Math.sin(player.animTimer * Math.PI) * 5 : 0;
  ctx.fillStyle = '#2e2a24';
  ctx.save();
  ctx.translate(sx - 5, bodyY + 11);
  ctx.rotate(legSwing * 0.05);
  ctx.fillRect(-2, 0, 4, 7);
  ctx.restore();
  ctx.save();
  ctx.translate(sx + 5, bodyY + 11);
  ctx.rotate(-legSwing * 0.05);
  ctx.fillRect(-2, 0, 4, 7);
  ctx.restore();

  const flashing = player.invulnTimer > 0 && Math.floor(player.invulnTimer * 12) % 2 === 0;

  if (spriteLoaded) {
    ctx.save();
    if (flashing) ctx.globalAlpha = 0.4;
    if (mouse.x < canvas.width / 2) {
      ctx.translate(sx, bodyY - 2);
      ctx.scale(-1, 1);
      ctx.drawImage(playerSprite, -SPRITE_SIZE / 2, -SPRITE_SIZE / 2, SPRITE_SIZE, SPRITE_SIZE);
    } else {
      ctx.drawImage(playerSprite, sx - SPRITE_SIZE / 2, bodyY - 2 - SPRITE_SIZE / 2, SPRITE_SIZE, SPRITE_SIZE);
    }
    ctx.restore();
  }
}

function drawBullets(camX, camY) {
  for (const b of bullets) {
    const sx = Math.round(b.x - camX);
    const sy = Math.round(b.y - camY);
    const angle = Math.atan2(b.vy, b.vx);

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(angle);
    ctx.fillStyle = 'rgba(255, 200, 90, 0.5)';
    ctx.fillRect(-16, -3, 16, 6);
    ctx.fillStyle = '#ffcf5c';
    ctx.beginPath();
    ctx.arc(0, 0, BULLET_RADIUS, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#7a4d10';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
  }
}

function drawPong() {
  // paddles
  ctx.fillStyle = '#e8e2d6';
  ctx.fillRect(PADDLE_INSET, paddleLeft.y, PADDLE_W, PADDLE_H);
  ctx.fillRect(canvas.width - PADDLE_INSET - PADDLE_W, paddleRight.y, PADDLE_W, PADDLE_H);

  // center dashed line (pong vibe)
  ctx.strokeStyle = 'rgba(232,226,214,0.15)';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 10]);
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);

  // ball
  ctx.fillStyle = '#f2f2f2';
  ctx.beginPath();
  ctx.arc(pongBall.x, pongBall.y, pongBall.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#b8b0a0';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawWaveBanner() {
  if (!waveBanner || waveBanner.timer <= 0) return;
  const alpha = Math.max(0, Math.min(1, waveBanner.timer / Math.min(0.6, waveBanner.fadeTotal)));
  const cx = canvas.width / 2;
  const cy = canvas.height * 0.28;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';

  ctx.font = 'bold 30px Trebuchet MS, sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillText(waveBanner.title, cx + 2, cy + 2);
  ctx.fillStyle = '#e0a458';
  ctx.fillText(waveBanner.title, cx, cy);

  ctx.font = 'bold 15px Consolas, monospace';
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillText(waveBanner.sub, cx + 1, cy + 27);
  ctx.fillStyle = '#f4ead9';
  ctx.fillText(waveBanner.sub, cx, cy + 26);

  ctx.restore();
  ctx.textAlign = 'left';
}

function drawCrosshair() {
  ctx.strokeStyle = 'rgba(244, 234, 217, 0.8)';
  ctx.lineWidth = 1.5;
  const r = 8;
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouse.x - r - 5, mouse.y);
  ctx.lineTo(mouse.x - r + 2, mouse.y);
  ctx.moveTo(mouse.x + r - 2, mouse.y);
  ctx.lineTo(mouse.x + r + 5, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - r - 5);
  ctx.lineTo(mouse.x, mouse.y - r + 2);
  ctx.moveTo(mouse.x, mouse.y + r - 2);
  ctx.lineTo(mouse.x, mouse.y + r + 5);
  ctx.stroke();
}

function drawHUD() {
  const barW = 220, barH = 18;
  const bx = 16, by = 16;
  const pct = Math.max(0, player.health / player.maxHealth);

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx - 3, by - 3, barW + 6, barH + 6);

  ctx.fillStyle = '#3a1414';
  ctx.fillRect(bx, by, barW, barH);

  const grad = ctx.createLinearGradient(bx, 0, bx + barW, 0);
  grad.addColorStop(0, '#e05a4f');
  grad.addColorStop(1, '#f0a24f');
  ctx.fillStyle = grad;
  ctx.fillRect(bx, by, barW * pct, barH);

  ctx.strokeStyle = '#efe3c9';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, barW, barH);

  ctx.fillStyle = '#f4ead9';
  ctx.font = 'bold 12px Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`HP  ${Math.max(0, Math.round(player.health))} / ${player.maxHealth}`, bx + barW / 2, by + barH - 4);
  ctx.textAlign = 'left';

  // wave / kill progress readout
  const wy = by + barH + 12;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx - 3, wy - 3, barW + 6, 24);
  ctx.fillStyle = '#e0a458';
  ctx.font = 'bold 13px Consolas, monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`Wave ${wave}`, bx + 2, wy + 14);
  ctx.fillStyle = '#f4ead9';
  ctx.font = '12px Consolas, monospace';
  ctx.textAlign = 'right';
  const killLabel = waveState === 'active'
    ? `Kills ${killsThisWave}/${killsRequired}`
    : `Wave cleared!`;
  ctx.fillText(killLabel, bx + barW - 2, wy + 14);
  ctx.textAlign = 'left';

  // mana readout
  const my = wy + 26;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx - 3, my - 3, barW + 6, 22);
  ctx.fillStyle = '#8fe3ff';
  ctx.font = 'bold 13px Consolas, monospace';
  ctx.fillText(`◆ Mana: ${player.mana}`, bx + 2, my + 13);

  if (player.invulnTimer > 0 && player.health <= 0.001) {
    // no-op guard
  }
}

requestAnimationFrame(loop);
</script>
</body>
