<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>God of Tree</title>
<style>
  :root {
    --grass-1: #3f6b3a;
    --grass-2: #4a7a44;
    --path: #b89b6a;
    --water: #3a6ea5;
    --tree: #2c4a29;
    --tree-trunk: #4a3221;
    --panel-bg: #1b1410;
    --panel-border: #6b4a2f;
    --ink: #f4ead9;
    --accent: #e0a458;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0e0b08;
    overflow: hidden;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }
  #gameWrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    background: var(--grass-1);
    image-rendering: pixelated;
    display: block;
  }
  #coords {
    position: absolute;
    bottom: 14px;
    left: 14px;
    background: var(--panel-bg);
    border: 2px solid var(--panel-border);
    border-radius: 6px;
    padding: 8px 12px;
    color: var(--ink);
    font-size: 12px;
    font-family: 'Consolas', monospace;
    opacity: 0.85;
  }
</style>
</head>
<body>
<div id="gameWrap">
  <canvas id="game"></canvas>
  <div id="coords">tile: (0, 0)</div>
</div>

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

  canvas.height = window.innerHeight;
  ctx.imageSmoothingEnabled = false; // resizing resets context state
}
window.addEventListener('resize', resizeCanvasToWindow);
window.addEventListener('orientationchange', resizeCanvasToWindow);

// --- Tile types (shared across all maps) ---
const TILE_GRASS = 0, TILE_GRASS2 = 1, TILE_PATH = 2, TILE_WATER = 3, TILE_TREE = 4;
const TILE_FLOOR = 5, TILE_WALL = 6, TILE_CONVEYOR = 7, TILE_FLAME = 8;
const TILE_SAND = 9, TILE_SAND2 = 10, TILE_CACTUS = 11;
const CONVEYOR_SPEED = 75; // px/sec pushed onto anyone standing on a conveyor tile
const CACTUS_DAMAGE = 6;   // damage per contact with a cactus patch

// --- Map: Tree (default forest map) ---
function generateTreeMap() {
  const width = 50, height = 50;
  const map = [];
  for (let y = 0; y < height; y++) {
    const row = [];
    for (let x = 0; x < width; x++) {
      let n = (Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1;
      n = Math.abs(n);
      row.push(n > 0.88 ? TILE_GRASS2 : TILE_GRASS);
    }
    map.push(row);
  }

  // a couple of winding paths branching out from the spawn area
  function carvePath(startX, startY) {
    let px = startX, py = startY;
    while (px < width - 2) {
      if (py >= 0 && py < height) {
        map[py][px] = TILE_PATH;
        if (px + 1 < width) map[py][px + 1] = TILE_PATH;
      }
      const r = Math.random();
      if (r < 0.28 && py > 2) py--;
      else if (r < 0.56 && py < height - 3) py++;
      px++;
    }
  }
  carvePath(2, Math.floor(height / 2) - 8);
  carvePath(2, Math.floor(height / 2) + 8);

  // several ponds of varying size scattered around
  const ponds = [
    { x: 34, y: 12, r: 3.2 },
    { x: 16, y: 38, r: 4 },
    { x: 42, y: 40, r: 2.6 },
    { x: 24, y: 22, r: 2.2 }
  ];
  for (const p of ponds) {
    const rr = Math.ceil(p.r * 1.4);
    for (let y = -rr; y <= rr; y++) {
      for (let x = -rr; x <= rr; x++) {
        const tx = p.x + x, ty = p.y + y;
        if (tx < 0 || ty < 0 || tx >= width || ty >= height) continue;
        if ((x * x) / (p.r * 1.4 * p.r * 1.4) + (y * y) / (p.r * p.r) < 1) map[ty][tx] = TILE_WATER;
      }
    }
  }

  // clustered groves of trees instead of uniform independent scatter
  const groveCount = 14;
  for (let g = 0; g < groveCount; g++) {
    const cx = Math.floor(Math.random() * width);
    const cy = Math.floor(Math.random() * height);
    const clusterSize = 10 + Math.floor(Math.random() * 12);
    for (let i = 0; i < clusterSize; i++) {
      const x = cx + Math.floor((Math.random() - 0.5) * 9);
      const y = cy + Math.floor((Math.random() - 0.5) * 9);
      if (x < 0 || y < 0 || x >= width || y >= height) continue;
      if (map[y][x] === TILE_GRASS || map[y][x] === TILE_GRASS2) {
        if (Math.random() < 0.65) map[y][x] = TILE_TREE;
      }
    }
  }

  // guarantee a safe spawn clearing
  const spawnTX = 5, spawnTY = Math.floor(height / 2);
  for (let y = spawnTY - 1; y <= spawnTY + 1; y++) {
    for (let x = spawnTX - 1; x <= spawnTX + 2; x++) {
      if (y >= 0 && y < height && x >= 0 && x < width) map[y][x] = TILE_GRASS;
    }
  }

  return {
    world: map, width, height,
    spawnX: spawnTX * TILE + TILE / 2,
    spawnY: spawnTY * TILE + TILE / 2
  };
}

// --- Map: Inferno (factory map with a lethal conveyor belt) ---
function generateInfernoMap() {
  const width = 30, height = 26;
  const map = [];
  for (let y = 0; y < height; y++) {
    const row = [];
    for (let x = 0; x < width; x++) {
      row.push(TILE_FLOOR);
    }
    map.push(row);
  }
  // perimeter walls
  for (let x = 0; x < width; x++) { map[0][x] = TILE_WALL; map[height - 1][x] = TILE_WALL; }
  for (let y = 0; y < height; y++) { map[y][0] = TILE_WALL; map[y][width - 1] = TILE_WALL; }

  // two conveyor lanes, both pushing south into a shared flame pit
  const laneAX = Math.floor(width * 0.35);
  const laneBX = Math.floor(width * 0.65);
  for (let y = 2; y < height - 6; y++) {
    map[y][laneAX - 1] = TILE_CONVEYOR;
    map[y][laneAX] = TILE_CONVEYOR;
    map[y][laneAX + 1] = TILE_CONVEYOR;
    map[y][laneBX - 1] = TILE_CONVEYOR;
    map[y][laneBX] = TILE_CONVEYOR;
    map[y][laneBX + 1] = TILE_CONVEYOR;
  }

  // wide shared flame pit spanning both lanes at the south end
  const pitLeft = Math.floor(width * 0.2), pitRight = Math.floor(width * 0.8);
  for (let y = height - 6; y < height - 1; y++) {
    for (let x = pitLeft; x <= pitRight; x++) {
      map[y][x] = TILE_FLAME;
    }
  }

  // pillar/machinery clusters scattered off the conveyor lanes
  for (let c = 0; c < 12; c++) {
    const cx = 2 + Math.floor(Math.random() * (width - 4));
    const cy = 2 + Math.floor(Math.random() * (height - 9));
    if (Math.abs(cx - laneAX) <= 2 || Math.abs(cx - laneBX) <= 2) continue; // keep both lanes clear
    for (let yy = 0; yy < 2; yy++) {
      for (let xx = 0; xx < 2; xx++) {
        const tx = cx + xx, ty = cy + yy;
        if (tx > 0 && ty > 0 && tx < width - 1 && ty < height - 1 && map[ty][tx] === TILE_FLOOR) {
          map[ty][tx] = TILE_WALL;
        }
      }
    }
  }

  // guarantee a safe spawn row between the two lanes
  const spawnTY = 1;
  const spawnTX = Math.floor(width / 2);
  for (let x = spawnTX - 2; x <= spawnTX + 2; x++) {
    if (x > 0 && x < width - 1) map[spawnTY][x] = TILE_FLOOR;
  }

  return {
    world: map, width, height,
    spawnX: spawnTX * TILE + TILE / 2,
    spawnY: spawnTY * TILE + TILE / 2
  };
}

function generateMapFor(mapId) {
  if (mapId === 'inferno') return generateInfernoMap();
  if (mapId === 'desert') return generateDesertMap();
  return generateTreeMap();
}

// --- Map: Desert (sandy terrain with damaging cacti) ---
function generateDesertMap() {
  const width = 40, height = 40;
  const map = [];
  for (let y = 0; y < height; y++) {
    const row = [];
    for (let x = 0; x < width; x++) {
      let n = (Math.sin(x * 15.234 + y * 41.17) * 31415.9) % 1;
      n = Math.abs(n);
      row.push(n > 0.85 ? TILE_SAND2 : TILE_SAND);
    }
    map.push(row);
  }

  // two oases scattered around instead of one dead-center pond
  const oases = [
    { x: 24, y: 12, r: 3.2 },
    { x: 12, y: 30, r: 2.6 }
  ];
  for (const o of oases) {
    const rr = Math.ceil(o.r * 1.4);
    for (let y = -rr; y <= rr; y++) {
      for (let x = -rr; x <= rr; x++) {
        const tx = o.x + x, ty = o.y + y;
        if (tx < 0 || ty < 0 || tx >= width || ty >= height) continue;
        if ((x * x) / (o.r * 1.4 * o.r * 1.4) + (y * y) / (o.r * o.r) < 1) map[ty][tx] = TILE_WATER;
      }
    }
  }

  // boulder/rock clusters as scattered obstacles
  for (let c = 0; c < 8; c++) {
    const cx = Math.floor(Math.random() * width);
    const cy = Math.floor(Math.random() * height);
    const size = 3 + Math.floor(Math.random() * 4);
    for (let i = 0; i < size; i++) {
      const x = cx + Math.floor((Math.random() - 0.5) * 5);
      const y = cy + Math.floor((Math.random() - 0.5) * 5);
      if (x < 0 || y < 0 || x >= width || y >= height) continue;
      if (map[y][x] === TILE_SAND || map[y][x] === TILE_SAND2) map[y][x] = TILE_WALL;
    }
  }

  // clustered cactus patches rather than uniform independent scatter
  for (let c = 0; c < 16; c++) {
    const cx = Math.floor(Math.random() * width);
    const cy = Math.floor(Math.random() * height);
    const size = 3 + Math.floor(Math.random() * 6);
    for (let i = 0; i < size; i++) {
      const x = cx + Math.floor((Math.random() - 0.5) * 6);
      const y = cy + Math.floor((Math.random() - 0.5) * 6);
      if (x < 0 || y < 0 || x >= width || y >= height) continue;
      if (map[y][x] === TILE_SAND || map[y][x] === TILE_SAND2) {
        if (Math.random() < 0.6) map[y][x] = TILE_CACTUS;
      }
    }
  }

  // guarantee a safe spawn point
  const spawnTX = 4, spawnTY = Math.floor(height / 2);
  for (let y = spawnTY - 1; y <= spawnTY + 1; y++) {
    for (let x = spawnTX - 1; x <= spawnTX + 2; x++) {
      if (y >= 0 && y < height && x >= 0 && x < width) map[y][x] = TILE_SAND;
    }
  }

  return {
    world: map, width, height,
    spawnX: spawnTX * TILE + TILE / 2,
    spawnY: spawnTY * TILE + TILE / 2
  };
}

let world = [];

function isBlocked(tileX, tileY) {
  if (tileX < 0 || tileY < 0 || tileX >= MAP_W || tileY >= MAP_H) return true;
  const t = world[tileY][tileX];
  return t === TILE_WATER || t === TILE_TREE || t === TILE_WALL;
}
function isBulletBlocked(tileX, tileY) {
  // bullets fly through trees and water, but still stop at solid walls
  if (tileX < 0 || tileY < 0 || tileX >= MAP_W || tileY >= MAP_H) return true;
  return world[tileY][tileX] === TILE_WALL;
}
function isWalkable(tileX, tileY) {
  if (tileX < 0 || tileY < 0 || tileX >= MAP_W || tileY >= MAP_H) return false;
  const t = world[tileY][tileX];
  return t === TILE_GRASS || t === TILE_GRASS2 || t === TILE_PATH || t === TILE_FLOOR || t === TILE_CONVEYOR || t === TILE_SAND || t === TILE_SAND2;
}

const ROLL_SPEED = 480;

function tryStartRoll() {
  if (player.rolling || player.rollCooldownTimer > 0) return;
  const { dx, dy } = getInputVector();
  let dirX = dx, dirY = dy;
  const len = Math.hypot(dirX, dirY);
  if (len > 0) {
    dirX /= len; dirY /= len;
  } else {
    // no movement input held — roll in the direction the player is currently facing
    if (player.dir === 'up') { dirX = 0; dirY = -1; }
    else if (player.dir === 'down') { dirX = 0; dirY = 1; }
    else if (player.dir === 'left') { dirX = -1; dirY = 0; }
    else { dirX = 1; dirY = 0; }
  }
  player.rolling = true;
  player.rollTimer = ROLL_DURATION;
  player.rollDirX = dirX;
  player.rollDirY = dirY;
  player.invulnTimer = Math.max(player.invulnTimer, ROLL_DURATION + 0.05);
}

function getInputVector() {
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  return { dx, dy };
}

function canMoveTo(nx, ny) {
  const halfW = player.w / 2 - 2;
  const halfH = player.h / 2 - 2;
  const corners = [
    [nx - halfW, ny - halfH],
    [nx + halfW, ny - halfH],
    [nx - halfW, ny + halfH],
    [nx + halfW, ny + halfH]
  ];
  for (const [cx, cy] of corners) {
    const tx = Math.floor(cx / TILE);
    const ty = Math.floor(cy / TILE);
    if (isBlocked(tx, ty)) return false;
  }
  return true;
}

const BULLET_RADIUS = 6.5;

let SPREAD_ANGLE = 0.05;

// --- Weapon tiers (upgraded via the shop, in strict order) ---
const WEAPON_TIERS = [
  { name: 'Pistol',         bulletsPerShot: 1, fireCooldown: 0.55, damage: 24, spread: 0.05 },
  { name: 'Assault Rifle',  bulletsPerShot: 1, fireCooldown: 0.16, damage: 15, spread: 0.09 },

// base stats come from the current weapon tier; bonus stats come from the
// granular shop upgrades (Fire Rate / Bullet Damage) — the two
// systems stack instead of overwriting each other
let weaponBaseBulletsPerShot = 1;
let weaponBaseFireCooldown = 0.55;
let weaponBaseDamage = 24;

let bonusBulletDamage = 0;

function recomputeGunStats() {
  BULLETS_PER_SHOT = weaponBaseBulletsPerShot + bonusBulletsPerShot;
  FIRE_COOLDOWN = Math.max(0.06, weaponBaseFireCooldown * fireRateMultiplier);

// --- Swords: automatic melee/ranged weapon that periodically attacks nearby enemies.
// Each sword is owned independently and you can freely switch which one is active. ---
const SWORD_DEFS = {
  shortsword: { name: 'Copper Shortsword', range: 55, arc: 0.5, damage: 16, cooldown: 0.85, jab: true, cost: 20 },
  breaker: { name: 'Breaker Blade', range: 78, arc: Math.PI * 1.2, damage: 30, cooldown: 1.1, jab: false, cost: 45 },
  daggers: { name: 'Throwing Daggers', ranged: true, range: 260, damage: 10, cooldown: 0.55, daggerCount: 3, daggerSpeed: 320, cost: 55 }
};
let swordShortswordOwned = false;
let swordBreakerOwned = false;
let swordDaggersOwned = false;
let equippedSword = null; // null | 'shortsword' | 'breaker' | 'daggers'
let meleeTimer = 0;
let meleeSwing = null; // { angle, range, arc, life, maxLife, jab }

function angleDiff(a, b) {
  let d = a - b;
  while (d > Math.PI) d -= Math.PI * 2;
  while (d < -Math.PI) d += Math.PI * 2;
  return d;
}

function updateMelee(dt) {
  if (meleeSwing) {
    meleeSwing.life -= dt;
    if (meleeSwing.life <= 0) meleeSwing = null;
  }

  if (!equippedSword) return;
  const tier = SWORD_DEFS[equippedSword];
  meleeTimer -= dt;
  if (meleeTimer > 0) return;

  // find the nearest valid target (enemy or banzai) within range
  let targetX = null, targetY = null, targetDist = Infinity;
  for (const e of enemies) {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < tier.range + e.radius && d < targetDist) {
      targetDist = d; targetX = e.x; targetY = e.y;
    }
  }
  for (const bz of banzais) {
    const d = Math.hypot(bz.x - player.x, bz.y - player.y);
    if (d < tier.range + bz.radius && d < targetDist) {
      targetDist = d; targetX = bz.x; targetY = bz.y;
    }
  }
  if (boss) {
    const d = Math.hypot(boss.x - player.x, boss.y - player.y);
    if (d < tier.range + boss.radius && d < targetDist) {
      targetDist = d; targetX = boss.x; targetY = boss.y;
    }
  }
  if (targetX === null) return; // nothing nearby — wait, don't waste the attack

  meleeTimer = tier.cooldown;
  const angle = Math.atan2(targetY - player.y, targetX - player.x);

  if (tier.ranged) {
    // throw daggers as ordinary bullets (reuses bullet collision/rendering) with
    // their own damage so the shop's Bullet Damage upgrade doesn't affect them
    const count = tier.daggerCount;
    for (let i = 0; i < count; i++) {
      const spread = count > 1 ? (i - (count - 1) / 2) * 0.18 : 0;
      const a = angle + spread;
      bullets.push({
        x: player.x, y: player.y - 6,
        vx: Math.cos(a) * tier.daggerSpeed,
        vy: Math.sin(a) * tier.daggerSpeed,
        life: 1.2,
        damage: tier.damage,
        isDagger: true
      });
    }
    return;
  }

  meleeSwing = { angle, range: tier.range, arc: tier.arc, life: 0.2, maxLife: 0.2, jab: tier.jab };

  for (const e of enemies) {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < tier.range + e.radius) {
      const a = Math.atan2(e.y - player.y, e.x - player.x);
      if (Math.abs(angleDiff(a, angle)) < tier.arc / 2) {
        e.hp -= tier.damage;
        e.hitFlash = 0.15;
      }
    }
  }
  for (const bz of banzais) {
    const d = Math.hypot(bz.x - player.x, bz.y - player.y);
    if (d < tier.range + bz.radius) {
      const a = Math.atan2(bz.y - player.y, bz.x - player.x);
      if (Math.abs(angleDiff(a, angle)) < tier.arc / 2) {
        bz.hp -= tier.damage;
        bz.hitFlash = 0.15;
      }
    }
  }
  if (boss) {
    const d = Math.hypot(boss.x - player.x, boss.y - player.y);
    if (d < tier.range + boss.radius) {
      const a = Math.atan2(boss.y - player.y, boss.x - player.x);
      if (Math.abs(angleDiff(a, angle)) < tier.arc / 2) {
        boss.hp -= tier.damage;
        boss.hitFlash = 0.15;
      }
    }
  }
}

function applyWeaponTier(idx) {
  const t = WEAPON_TIERS[idx];
  weaponBaseBulletsPerShot = t.bulletsPerShot;
  weaponBaseFireCooldown = t.fireCooldown;
  weaponBaseDamage = t.damage;
  SPREAD_ANGLE = t.spread;
  weaponExplosive = !!t.explosive;
  weaponExplosionRadius = t.explosionRadius || 0;
  recomputeGunStats();
}

function dirToAngle(dir) {
  switch (dir) {
    case 'right': return 0;
    case 'down': return Math.PI / 2;
    case 'left': return Math.PI;
    case 'up': return -Math.PI / 2;
    default: return 0;
  }
}

function aimAngle() {
  return Math.atan2(mouse.y - canvas.height / 2, mouse.x - canvas.width / 2);
}

function fireShotgun() {
  const baseAngle = aimAngle();
  for (let i = 0; i < BULLETS_PER_SHOT; i++) {
    const spread = BULLETS_PER_SHOT > 1
      ? (i - (BULLETS_PER_SHOT - 1) / 2) * (SPREAD_ANGLE / (BULLETS_PER_SHOT - 1))
      : (Math.random() - 0.5) * SPREAD_ANGLE;
    const angle = baseAngle + spread + (Math.random() - 0.5) * 0.06;
    bullets.push({
      x: player.x,
      y: player.y - 8,
      vx: Math.cos(angle) * BULLET_SPEED * (0.85 + Math.random() * 0.3),
      vy: Math.sin(angle) * BULLET_SPEED * (0.85 + Math.random() * 0.3),
      life: 0.9,
      explosive: weaponExplosive,
      explosionRadius: weaponExplosionRadius
    });
  }
}

function pickEnemyType(w) {
  const options = [];
  if (w >= ENEMY_TYPES.blob.minWave) options.push({ type: 'blob', weight: 3 });
  if (w >= ENEMY_TYPES.shooter.minWave) options.push({ type: 'shooter', weight: 2 });
  if (w >= ENEMY_TYPES.laser.minWave) options.push({ type: 'laser', weight: 1.5 });
  if (w >= ENEMY_TYPES.brute.minWave) options.push({ type: 'brute', weight: 1 });
  if (w >= ENEMY_TYPES.gunner.minWave) options.push({ type: 'gunner', weight: 1.1 });
  if (w >= ENEMY_TYPES.heavylaser.minWave) options.push({ type: 'heavylaser', weight: 0.9 });
  if (w >= ENEMY_TYPES.warbrute.minWave) options.push({ type: 'warbrute', weight: 0.7 });
  if (w >= ENEMY_TYPES.megablob.minWave) options.push({ type: 'megablob', weight: 0.8 });
  const total = options.reduce((s, o) => s + o.weight, 0);
  let r = Math.random() * total;
  for (const o of options) {
    if (r < o.weight) return o.type;
    r -= o.weight;
  }
  return options[options.length - 1].type;
}

// wave state
let wave = 1;
let killsThisWave = 0;
let killsRequired = waveKillsRequired(wave);
let waveState = 'active';       // 'active' | 'intermission'
const WAVE_INTERMISSION = Infinity; // shop never forces you to start the next wave — take your time
let intermissionTimer = 0;
let waveBanner = null;          // { title, sub, timer, fadeTotal }

function waveKillsRequired(w) {
  return 5 + w * 3; // wave 1 = 8, wave 2 = 11, wave 3 = 14, ...
}
function waveConcurrentCap(w) {
  return Math.min(12 + w * 2, 28); // wave 1 = 14 enemies on screen at once — a real swarm
}

function findWalkableTile() {
  for (let attempts = 0; attempts < 200; attempts++) {
    const tx = Math.floor(Math.random() * MAP_W);
    const ty = Math.floor(Math.random() * MAP_H);
    if (isWalkable(tx, ty)) {
      const wx = tx * TILE + TILE / 2;
      const wy = ty * TILE + TILE / 2;
      if (Math.hypot(wx - SPAWN_X, wy - SPAWN_Y) > 5 * TILE) {
        return { x: wx, y: wy };
      }
    }
  }
  return { x: 10 * TILE, y: 10 * TILE };
}

function spawnEnemy() {
  const pos = findWalkableTile();
  const type = pickEnemyType(wave);
  const def = ENEMY_TYPES[type];
  const hp = Math.round(def.hp * difficultyHpMultiplier());
  enemies.push({
    type,
    x: pos.x,
    y: pos.y,
    hp,
    maxHp: hp,
    radius: def.radius,
    wanderAngle: Math.random() * Math.PI * 2,
    wanderTimer: Math.random() * 2,
    touchCooldown: 0,
    hitFlash: 0,
    attackTimer: 0.5 + Math.random() * 1.5, // stagger initial attacks so enemies don't all fire at once
    telegraphActive: false,
    telegraphTimer: 0,
    aimAngle: 0
  });
}

function startWave(w) {
  wave = w;
  killsThisWave = 0;
  waveState = 'active';
  respawnQueue.length = 0;
  enemies.length = 0;
  boss = null;

  if (isBossWave(w)) {
    killsRequired = 1;
    spawnBoss(w);
    waveBanner = { title: `Wave ${wave}`, sub: 'BOSS: The Elder Root awakens!', timer: 3, fadeTotal: 3 };
    return;
  }

  killsRequired = waveKillsRequired(wave);
  const cap = waveConcurrentCap(wave);
  for (let i = 0; i < cap; i++) spawnEnemy();

  let sub = `Kill ${killsRequired} enemies`;
  if (w === ENEMY_TYPES.shooter.minWave) sub = 'New enemy: Shooters (cowboy hats, ranged pellets)!';
  else if (w === ENEMY_TYPES.laser.minWave) sub = 'New enemy: Laserguys (straight beam attack)!';
  else if (w === ENEMY_TYPES.brute.minWave) sub = 'New enemy: Brutes (heavy smash attack)!';
  else if (w === ENEMY_TYPES.gunner.minWave) sub = 'New enemy: Gunners (3-shot burst)!';
  else if (w === BANZAI_MIN_WAVE) sub = 'Banzai Bill incoming — a giant flying bullet!';
  else if (w === ENEMY_TYPES.heavylaser.minWave) sub = 'New enemy: Heavy Laserguys (wide beam)!';
  else if (w === ENEMY_TYPES.warbrute.minWave) sub = 'New enemy: War Brutes (huge smash)!';
  else if (w === ENEMY_TYPES.megablob.minWave) sub = 'New enemy: Mega Blobs (tanky + spits pellets)!';

  waveBanner = { title: `Wave ${wave}`, sub, timer: 2.6, fadeTotal: 2.6 };
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const def = ENEMY_TYPES[e.type];
    if (e.hitFlash > 0) e.hitFlash -= dt;
    if (e.touchCooldown > 0) e.touchCooldown -= dt;
    if (e.attackTimer > 0) e.attackTimer -= dt;

    const dxp = player.x - e.x;
    const dyp = player.y - e.y;
    const distToPlayer = Math.hypot(dxp, dyp) || 0.001;

    const isRanged = e.type === 'shooter' || e.type === 'laser' || e.type === 'gunner' || e.type === 'heavylaser';
    const isTelegraphing = e.telegraphActive;

    let moveX = 0, moveY = 0, speed = def.wanderSpeed;

    if (!isTelegraphing) {
      if (isRanged) {
        if (distToPlayer < def.aggroRange) {
          if (distToPlayer > def.preferredRange * 1.15) {
            moveX = dxp / distToPlayer; moveY = dyp / distToPlayer; speed = def.chaseSpeed;
          } else if (distToPlayer < def.preferredRange * 0.7) {
            moveX = -dxp / distToPlayer; moveY = -dyp / distToPlayer; speed = def.chaseSpeed;
          } else {
            speed = 0; // holding position to fire
          }
        } else {
          e.wanderTimer -= dt;
          if (e.wanderTimer <= 0) { e.wanderAngle = Math.random() * Math.PI * 2; e.wanderTimer = 1.5 + Math.random() * 2; }
          moveX = Math.cos(e.wanderAngle); moveY = Math.sin(e.wanderAngle);
        }
      } else {
        if (distToPlayer < def.aggroRange) {
          moveX = dxp / distToPlayer; moveY = dyp / distToPlayer; speed = def.chaseSpeed;
        } else {
          e.wanderTimer -= dt;
          if (e.wanderTimer <= 0) { e.wanderAngle = Math.random() * Math.PI * 2; e.wanderTimer = 1.5 + Math.random() * 2; }
          moveX = Math.cos(e.wanderAngle); moveY = Math.sin(e.wanderAngle);
        }
      }

      const nx = e.x + moveX * speed * dt;
      const ny = e.y + moveY * speed * dt;
      if (!isBlocked(Math.floor(nx / TILE), Math.floor(e.y / TILE))) e.x = nx;
      if (!isBlocked(Math.floor(e.x / TILE), Math.floor(ny / TILE))) e.y = ny;
    }

    // contact damage (all types have some, melee types rely on it more)
    if (distToPlayer < e.radius + player.hitRadius && e.touchCooldown <= 0 && player.invulnTimer <= 0) {
      damagePlayer(def.contactDamage);
      player.invulnTimer = 0.4;
      e.touchCooldown = def.contactCooldown;
    }

    // --- type-specific attacks ---
    if ((e.type === 'shooter' || e.type === 'gunner') && !isTelegraphing && distToPlayer < def.aggroRange && e.attackTimer <= 0) {
      e.attackTimer = def.shootCooldown;
      const baseAngle = Math.atan2(dyp, dxp);
      const count = def.pelletCount || 1;
      for (let p = 0; p < count; p++) {
        const spread = count > 1 ? (p - (count - 1) / 2) * (def.pelletSpread / (count - 1)) : 0;
        const angle = baseAngle + spread + (Math.random() - 0.5) * 0.1;
        enemyBullets.push({
          x: e.x, y: e.y - 6,
          vx: Math.cos(angle) * def.pelletSpeed,
          vy: Math.sin(angle) * def.pelletSpeed,
          damage: def.pelletDamage,
          radius: def.pelletRadius,
          life: 2.5
        });
      }
    }

    if (e.type === 'megablob' && !isTelegraphing && distToPlayer < def.aggroRange && e.attackTimer <= 0) {
      e.attackTimer = def.spitCooldown;
      const baseAngle = Math.atan2(dyp, dxp);
      const count = def.pelletCount || 1;
      for (let p = 0; p < count; p++) {
        const spread = count > 1 ? (p - (count - 1) / 2) * (def.pelletSpread / (count - 1)) : 0;
        const angle = baseAngle + spread + (Math.random() - 0.5) * 0.1;
        enemyBullets.push({
          x: e.x, y: e.y - 6,
          vx: Math.cos(angle) * def.pelletSpeed,
          vy: Math.sin(angle) * def.pelletSpeed,
          damage: def.pelletDamage,
          radius: def.pelletRadius,
          life: 2.5
        });
      }
    }

    if (e.type === 'laser' || e.type === 'heavylaser') {
      if (!isTelegraphing && distToPlayer < def.aggroRange && e.attackTimer <= 0) {
        e.telegraphActive = true;
        e.telegraphTimer = def.laserTelegraph;
        e.aimAngle = Math.atan2(dyp, dxp);
      } else if (isTelegraphing) {
        e.telegraphTimer -= dt;
        if (e.telegraphTimer <= 0) {
          e.telegraphActive = false;
          e.attackTimer = def.laserCooldown;
          const angle = e.aimAngle;
          const dirX = Math.cos(angle), dirY = Math.sin(angle);
          const x2 = e.x + dirX * def.laserRange;
          const y2 = e.y + dirY * def.laserRange;
          lasers.push({ x1: e.x, y1: e.y, x2, y2, life: 0.18, maxLife: 0.18 });

          // perpendicular-distance hit check against the player
          const toPx = player.x - e.x, toPy = player.y - e.y;
          const proj = toPx * dirX + toPy * dirY;
          if (proj > 0 && proj < def.laserRange) {
            const closestX = e.x + dirX * proj, closestY = e.y + dirY * proj;
            const perpDist = Math.hypot(player.x - closestX, player.y - closestY);
            if (perpDist < def.laserWidth / 2 + player.hitRadius && player.invulnTimer <= 0) {
              damagePlayer(def.laserDamage);
              player.invulnTimer = 0.4;
            }
          }
        }
      }
    }

    if (e.type === 'brute' || e.type === 'warbrute') {
      if (!isTelegraphing && distToPlayer < def.smashRange && e.attackTimer <= 0) {
        e.telegraphActive = true;
        e.telegraphTimer = def.smashTelegraph;
      } else if (isTelegraphing) {
        e.telegraphTimer -= dt;
        if (e.telegraphTimer <= 0) {
          e.telegraphActive = false;
          e.attackTimer = def.smashCooldown;
          const smashDist = Math.hypot(player.x - e.x, player.y - e.y);
          if (smashDist < def.smashRadius + player.hitRadius && player.invulnTimer <= 0) {
            damagePlayer(def.smashDamage);
            player.invulnTimer = 0.6;
          }
        }
      }
    }

    if (e.hp <= 0) {
      spawnManaDrop(e.x, e.y, def.manaMin, def.manaMax);
      enemies.splice(i, 1);
      if (waveState === 'active') {
        killsThisWave++;
        if (killsThisWave >= killsRequired) {
          // wave cleared — sweep the board and start the intermission countdown
          waveState = 'intermission';
          intermissionTimer = WAVE_INTERMISSION;
          respawnQueue.length = 0;
          enemies.length = 0;
          waveBanner = {
            title: `Wave ${wave} Cleared!`,
            sub: `Shop is open`,
            timer: 2.2,
            fadeTotal: 2.2
          };
          break; // array is now empty — stop iterating over stale indices
        } else {
          respawnQueue.push(3 + Math.random() * 2);
        }
      }
    }
  }

  if (waveState === 'active' && !boss) {
    for (let i = respawnQueue.length - 1; i >= 0; i--) {
      respawnQueue[i] -= dt;
      if (respawnQueue[i] <= 0 && enemies.length < waveConcurrentCap(wave)) {
        respawnQueue.splice(i, 1);
        spawnEnemy();
      }
    }
  } else if (waveState === 'intermission') {
    intermissionTimer -= dt;
    if (intermissionTimer <= 0) {
      startWave(wave + 1);
    }
  }

  if (waveBanner) {
    waveBanner.timer -= dt;
  }

  updateEnemyProjectiles(dt);
  updateManaDrops(dt);
}

function updateEnemyProjectiles(dt) {
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const b = enemyBullets[i];
    if (b.curve) {
      const speed = Math.hypot(b.vx, b.vy);
      const angle = Math.atan2(b.vy, b.vx) + b.curve * dt;
      b.vx = Math.cos(angle) * speed;
      b.vy = Math.sin(angle) * speed;
    }
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;

    let hit = false;
    if (Math.hypot(b.x - player.x, b.y - player.y) < b.radius + player.hitRadius && player.invulnTimer <= 0) {
      damagePlayer(b.damage);
      player.invulnTimer = 0.4;
      hit = true;
    }

    const tx = Math.floor(b.x / TILE), ty = Math.floor(b.y / TILE);
    if (hit || b.life <= 0 || isBulletBlocked(tx, ty)) {
      enemyBullets.splice(i, 1);
    }
  }

  for (let i = lasers.length - 1; i >= 0; i--) {
    lasers[i].life -= dt;
    if (lasers[i].life <= 0) lasers.splice(i, 1);
  }
}

// --- Banzai Bill: a giant flying bullet that ignores terrain ---
const banzais = [];
const BANZAI_MIN_WAVE = 9;
const BANZAI_HP = 220;
const BANZAI_RADIUS = 26;
const BANZAI_SPEED = 230;
const BANZAI_DAMAGE = 30;
const BANZAI_MANA_MIN = 20, BANZAI_MANA_MAX = 30;
let banzaiTimer = 6;

function spawnBanzai() {
  const angle = Math.random() * Math.PI * 2;
  const spawnDist = 620;
  const sx = player.x + Math.cos(angle) * spawnDist;
  const sy = player.y + Math.sin(angle) * spawnDist;
  const targetX = player.x + (Math.random() - 0.5) * 220;
  const targetY = player.y + (Math.random() - 0.5) * 220;
  const dx = targetX - sx, dy = targetY - sy;
  const dist = Math.hypot(dx, dy) || 1;
  const hp = Math.round(BANZAI_HP * difficultyHpMultiplier());
  banzais.push({
    x: sx, y: sy,
    vx: (dx / dist) * BANZAI_SPEED,
    vy: (dy / dist) * BANZAI_SPEED,
    hp, maxHp: hp,
    radius: BANZAI_RADIUS,
    hitFlash: 0,
    life: 25
  });
}

function updateBanzais(dt) {
  if (waveState === 'active' && wave >= BANZAI_MIN_WAVE) {
    banzaiTimer -= dt;
    if (banzaiTimer <= 0) {
      spawnBanzai();
      banzaiTimer = 8 + Math.random() * 8;
    }
  }

  for (let i = banzais.length - 1; i >= 0; i--) {
    const b = banzais[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
    if (b.hitFlash > 0) b.hitFlash -= dt;

    if (b.hp <= 0) {
      spawnManaDrop(b.x, b.y, BANZAI_MANA_MIN, BANZAI_MANA_MAX);
      banzais.splice(i, 1);
      continue;
    }

    const dist = Math.hypot(player.x - b.x, player.y - b.y);
    if (dist < b.radius + player.hitRadius && player.invulnTimer <= 0) {
      damagePlayer(BANZAI_DAMAGE);
      player.invulnTimer = 0.6;
      banzais.splice(i, 1);
      continue;
    }

    if (b.life <= 0 || dist > 1500) {
      banzais.splice(i, 1);
    }
  }
}

// --- Boss fight: The Elder Root — a corrupted tree that awakens every 20 waves ---
const BOSS_INTERVAL = 20;
let boss = null; // { x,y,hp,maxHp,radius,hitFlash,touchCooldown,attackCooldown,telegraphActive,telegraphTimer,currentAttack,branches:[] }

function isBossWave(w) {
  return w % BOSS_INTERVAL === 0;
}

function spawnBoss(w) {
  const scale = (1 + Math.floor(w / BOSS_INTERVAL - 1) * 0.5) * difficultyHpMultiplier();
  const angle = Math.random() * Math.PI * 2;
  const dist = 260;
  boss = {
    x: player.x + Math.cos(angle) * dist,
    y: player.y + Math.sin(angle) * dist,
    hp: Math.round(40000 * scale),
    maxHp: Math.round(40000 * scale),
    radius: 52,
    hitFlash: 0,
    touchCooldown: 0,
    attackCooldown: 1.6,
    telegraphActive: false,
    telegraphTimer: 0,
    currentAttack: 'slam',
    branches: [],
    proximity: 0
  };
}

const BOSS_ATTACKS = ['slam', 'acorns', 'branches', 'spiral', 'crossfire', 'aimedBarrage'];

function bossExecuteAttack(type) {
  if (!boss) return;
  if (type === 'slam') {
    const smashRadius = 130;
    const dist = Math.hypot(player.x - boss.x, player.y - boss.y);
    if (dist < smashRadius + player.hitRadius && player.invulnTimer <= 0) {
      damagePlayer(48);
      player.invulnTimer = 0.6;
    }
    explosions.push({ x: boss.x, y: boss.y, radius: smashRadius, life: 0.4, maxLife: 0.4 });
  } else if (type === 'acorns') {
    const count = 20;
    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2;
      enemyBullets.push({
        x: boss.x, y: boss.y,
        vx: Math.cos(angle) * 230, vy: Math.sin(angle) * 230,
        damage: 16, radius: 7, life: 3
      });
    }
  } else if (type === 'branches') {
    for (let i = 0; i < 7; i++) {
      boss.branches.push({
        x: player.x + (Math.random() - 0.5) * 280,
        y: player.y + (Math.random() - 0.5) * 280,
        timer: 0.9, maxTimer: 0.9
      });
    }
  } else if (type === 'spiral') {
    // two intertwined spiral arms, curving opposite directions as they travel outward
    const perArm = 12;
    for (let arm = 0; arm < 2; arm++) {
      const dirSign = arm === 0 ? 1 : -1;
      for (let i = 0; i < perArm; i++) {
        const angle = arm * Math.PI + (i / perArm) * Math.PI * 2;
        enemyBullets.push({
          x: boss.x, y: boss.y,
          vx: Math.cos(angle) * 150, vy: Math.sin(angle) * 150,
          damage: 14, radius: 6, life: 4,
          curve: dirSign * 2.4
        });
      }
    }
  } else if (type === 'crossfire') {
    // 4 rotating arms, each a staggered-speed burst so they fan out into a pinwheel
    const arms = 4, perArm = 6;
    const armOffset = Math.random() * Math.PI * 2;
    for (let a = 0; a < arms; a++) {
      const armAngle = armOffset + (a / arms) * Math.PI * 2;
      for (let i = 0; i < perArm; i++) {
        const spd = 150 + i * 35;
        enemyBullets.push({
          x: boss.x, y: boss.y,
          vx: Math.cos(armAngle) * spd, vy: Math.sin(armAngle) * spd,
          damage: 14, radius: 6, life: 3.2,
          curve: 1.1
        });
      }
    }
  } else if (type === 'aimedBarrage') {
    // a tight, fast, directly-aimed cluster — dangerous precisely because it's NOT random
    const baseAngle = Math.atan2(player.y - boss.y, player.x - boss.x);
    const count = 7;
    for (let i = 0; i < count; i++) {
      const spread = (i - (count - 1) / 2) * 0.1;
      enemyBullets.push({
        x: boss.x, y: boss.y,
        vx: Math.cos(baseAngle + spread) * 300, vy: Math.sin(baseAngle + spread) * 300,
        damage: 20, radius: 7, life: 2.5
      });
    }
  }
}

function updateBossBranches(dt) {
  if (!boss) return;
  for (let i = boss.branches.length - 1; i >= 0; i--) {
    const br = boss.branches[i];
    br.timer -= dt;
    if (br.timer <= 0) {
      const dist = Math.hypot(player.x - br.x, player.y - br.y);
      if (dist < 34 + player.hitRadius && player.invulnTimer <= 0) {
        damagePlayer(30);
        player.invulnTimer = 0.5;
      }
      explosions.push({ x: br.x, y: br.y, radius: 34, life: 0.3, maxLife: 0.3 });
      boss.branches.splice(i, 1);
    }
  }
}

function updateBoss(dt) {
  if (!boss) return;
  if (boss.hitFlash > 0) boss.hitFlash -= dt;
  if (boss.touchCooldown > 0) boss.touchCooldown -= dt;

  const dx = player.x - boss.x, dy = player.y - boss.y;
  const dist = Math.hypot(dx, dy) || 0.001;
  boss.proximity = Math.max(0, Math.min(1, 1 - (dist - boss.radius) / 260));

  if (!boss.telegraphActive && dist > 120) {
    boss.x += (dx / dist) * 78 * dt;
    boss.y += (dy / dist) * 78 * dt;
  }

  if (dist < boss.radius + player.hitRadius && boss.touchCooldown <= 0 && player.invulnTimer <= 0) {
    damagePlayer(18);
    player.invulnTimer = 0.4;
    boss.touchCooldown = 0.6;
  }

  boss.attackCooldown -= dt;
  if (!boss.telegraphActive && boss.attackCooldown <= 0) {
    boss.currentAttack = BOSS_ATTACKS[Math.floor(Math.random() * BOSS_ATTACKS.length)];
    boss.telegraphActive = true;
    boss.telegraphTimer = 0.6;
  }

  if (boss.telegraphActive) {
    boss.telegraphTimer -= dt;
    if (boss.telegraphTimer <= 0) {
      boss.telegraphActive = false;
      boss.attackCooldown = 2.0;
      bossExecuteAttack(boss.currentAttack);
    }
  }

  updateBossBranches(dt);

  if (boss.hp <= 0) {
    const bx = boss.x, by = boss.y;
    spawnManaDrop(bx, by, 60, 90);
    for (let i = 0; i < 4; i++) {
      spawnManaDrop(bx + (Math.random() - 0.5) * 60, by + (Math.random() - 0.5) * 60, 20, 35);
    }
    boss = null;
    waveState = 'intermission';
    intermissionTimer = WAVE_INTERMISSION;
    enemies.length = 0;
    respawnQueue.length = 0;
    waveBanner = { title: 'The Elder Root falls!', sub: 'Shop is open', timer: 2.6, fadeTotal: 2.6 };
  }
}

// --- Mana drops ---
const manaDrops = [];
let MANA_PICKUP_RADIUS = 20;
const MANA_DROP_LIFETIME = 20;

function spawnManaDrop(x, y, minAmt = 4, maxAmt = 7) {
  const base = minAmt + Math.floor(Math.random() * (maxAmt - minAmt + 1));
  const amount = pongEquipped ? Math.round(base * PONG_MANA_MULTIPLIER) : base;
  manaDrops.push({
    x, y,
    amount,
    age: 0,
    bob: Math.random() * Math.PI * 2
  });
}

function updateManaDrops(dt) {
  for (let i = manaDrops.length - 1; i >= 0; i--) {
    const m = manaDrops[i];
    m.age += dt;
    m.bob += dt * 3;
    const dist = Math.hypot(player.x - m.x, player.y - m.y);
    if (dist < MANA_PICKUP_RADIUS + player.hitRadius) {
      player.mana += m.amount;
      manaDrops.splice(i, 1);
      continue;
    }
    if (m.age > MANA_DROP_LIFETIME) {
      manaDrops.splice(i, 1);
    }
  }
}

function drawManaDrop(m, camX, camY) {
  const sx = Math.round(m.x - camX);
  const sy = Math.round(m.y - camY) + Math.sin(m.bob) * 3;
  const fadeOut = m.age > MANA_DROP_LIFETIME - 3 ? Math.max(0, (MANA_DROP_LIFETIME - m.age) / 3) : 1;

  ctx.save();
  ctx.globalAlpha = fadeOut;
  ctx.shadowColor = '#7ad9ff';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#8fe3ff';
  ctx.beginPath();
  ctx.moveTo(sx, sy - 6);
  ctx.lineTo(sx + 5, sy);
  ctx.lineTo(sx, sy + 6);
  ctx.lineTo(sx - 5, sy);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#e0f8ff';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();
}

// --- Equipment: Garden Snake (eats apples scattered around the map for passive Mana) ---
const SNAKE_SPEED = 90;
const SNAKE_APPLE_COUNT = 5;
const SNAKE_EAT_RADIUS = 18;
const SNAKE_MAX_SEGMENTS = 6;
const SNAKE_SEGMENT_DELAY = 0.12;

const apples = [];
let snakeHead = { x: 0, y: 0 };
const snakeHistory = [];
let snakeGameTime = 0;
const snakeSegments = [];

function spawnApple() {
  const pos = findWalkableTile();
  apples.push({ x: pos.x, y: pos.y });
}

function ensureApples() {
  while (apples.length < SNAKE_APPLE_COUNT) spawnApple();
}

function initSnake() {
  snakeHead = { x: player.x, y: player.y };
  snakeHistory.length = 0;
  snakeGameTime = 0;
  apples.length = 0;
  ensureApples();
}

function updateSnake(dt) {
  if (!snakeEquipped) return;
  ensureApples();
  snakeGameTime += dt;

  let nearestIdx = -1, nearestDist = Infinity;
  for (let i = 0; i < apples.length; i++) {
    const d = Math.hypot(apples[i].x - snakeHead.x, apples[i].y - snakeHead.y);
    if (d < nearestDist) { nearestDist = d; nearestIdx = i; }
  }

  if (nearestIdx >= 0) {
    const target = apples[nearestIdx];
    const dx = target.x - snakeHead.x, dy = target.y - snakeHead.y;
    const dist = Math.hypot(dx, dy) || 1;
    snakeHead.x += (dx / dist) * SNAKE_SPEED * dt;
    snakeHead.y += (dy / dist) * SNAKE_SPEED * dt;

    if (dist < SNAKE_EAT_RADIUS) {
      apples.splice(nearestIdx, 1);
      spawnApple();
      const amt = SNAKE_MANA_PER_APPLE_MIN + Math.floor(Math.random() * (SNAKE_MANA_PER_APPLE_MAX - SNAKE_MANA_PER_APPLE_MIN + 1));
      player.mana += amt;
    }
  }

  snakeHistory.push({ t: snakeGameTime, x: snakeHead.x, y: snakeHead.y });
  const maxAge = SNAKE_SEGMENT_DELAY * (SNAKE_MAX_SEGMENTS + 1) + 0.5;
  while (snakeHistory.length && snakeHistory[0].t < snakeGameTime - maxAge) snakeHistory.shift();

  snakeSegments.length = 0;
  for (let i = 1; i <= SNAKE_MAX_SEGMENTS; i++) {
    const targetT = snakeGameTime - i * SNAKE_SEGMENT_DELAY;
    let pos = snakeHead;
    for (let j = 0; j < snakeHistory.length; j++) {
      pos = snakeHistory[j];
      if (snakeHistory[j].t >= targetT) break;
    }
    snakeSegments.push({ x: pos.x, y: pos.y });
  }
}

function drawApple(a, camX, camY) {
  const sx = Math.round(a.x - camX), sy = Math.round(a.y - camY);
  ctx.fillStyle = '#3a6b2f';
  ctx.fillRect(sx - 1, sy - 11, 2, 5);
  ctx.fillStyle = '#d43a2f';
  ctx.beginPath();
  ctx.arc(sx, sy, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#7a1a12';
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.beginPath();
  ctx.arc(sx - 2, sy - 2, 2, 0, Math.PI * 2);
  ctx.fill();
}

function drawApples(camX, camY) {
  if (!snakeEquipped) return;
  for (const a of apples) drawApple(a, camX, camY);
}

function drawSnake(camX, camY) {
  if (!snakeEquipped) return;
  for (let i = snakeSegments.length - 1; i >= 0; i--) {
    const s = snakeSegments[i];
    const sx = Math.round(s.x - camX), sy = Math.round(s.y - camY);
    const size = Math.max(3, 8 - i * 0.7);
    ctx.fillStyle = '#4a9a4a';
    ctx.beginPath();
    ctx.arc(sx, sy, size, 0, Math.PI * 2);
    ctx.fill();
  }
  const hx = Math.round(snakeHead.x - camX), hy = Math.round(snakeHead.y - camY);
  ctx.fillStyle = '#5ab55a';
  ctx.beginPath();
  ctx.arc(hx, hy, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#0a2a0a';
  ctx.beginPath();
  ctx.arc(hx - 3, hy - 2, 1.5, 0, Math.PI * 2);
  ctx.arc(hx + 3, hy - 2, 1.5, 0, Math.PI * 2);
  ctx.fill();
}

// --- Equipment: Tetro Strike (falling blocks that explode into bullets) ---
const TETRIS_INTERVAL_MIN = 7, TETRIS_INTERVAL_MAX = 12;
const TETRIS_FALL_TIME = 0.9;
const TETRIS_ARM_TIME = 0.5;
const TETRIS_EXPLOSION_BULLETS = 14;
const tetrisPieces = [];
let tetrisSpawnTimer = 6;

function updateTetris(dt) {
  if (!tetrisEquipped) return;
  tetrisSpawnTimer -= dt;
  if (tetrisSpawnTimer <= 0) {
    tetrisSpawnTimer = TETRIS_INTERVAL_MIN + Math.random() * (TETRIS_INTERVAL_MAX - TETRIS_INTERVAL_MIN);
    const angle = Math.random() * Math.PI * 2;
    const dist = 120 + Math.random() * 260;
    tetrisPieces.push({
      x: player.x + Math.cos(angle) * dist,
      y: player.y + Math.sin(angle) * dist,
      phase: 'falling',
      timer: TETRIS_FALL_TIME
    });
  }
  for (let i = tetrisPieces.length - 1; i >= 0; i--) {
    const p = tetrisPieces[i];
    p.timer -= dt;
    if (p.phase === 'falling' && p.timer <= 0) {
      p.phase = 'armed';
      p.timer = TETRIS_ARM_TIME;
    } else if (p.phase === 'armed' && p.timer <= 0) {
      explodeTetrisPiece(p);
      tetrisPieces.splice(i, 1);
    }
  }
}

function explodeTetrisPiece(p) {
  const N = TETRIS_EXPLOSION_BULLETS;
  for (let i = 0; i < N; i++) {
    const angle = (i / N) * Math.PI * 2 + Math.random() * 0.15;
    const spd = BULLET_SPEED * (0.6 + Math.random() * 0.6);
    bullets.push({
      x: p.x, y: p.y,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 0.8
    });
  }
}

function drawTetrisBlock(cx, cy, scale) {
  const s = 9 * scale;
  ctx.fillStyle = '#e8c93a';
  ctx.fillRect(cx - s, cy - s, s * 2, s * 2);
  ctx.strokeStyle = '#7a6320';
  ctx.lineWidth = 2;
  ctx.strokeRect(cx - s, cy - s, s * 2, s * 2);
  ctx.strokeRect(cx - s, cy - s, s, s);
  ctx.strokeRect(cx, cy - s, s, s);
  ctx.strokeRect(cx - s, cy, s, s);
  ctx.strokeRect(cx, cy, s, s);
}

function drawTetrisPieces(camX, camY) {
  if (!tetrisEquipped) return;
  for (const p of tetrisPieces) {
    const sx = Math.round(p.x - camX), sy = Math.round(p.y - camY);
    if (p.phase === 'falling') {
      const t = 1 - Math.max(0, p.timer / TETRIS_FALL_TIME);
      const dropHeight = (1 - t) * 120;
      ctx.fillStyle = `rgba(0,0,0,${0.15 + 0.25 * t})`;
      ctx.beginPath();
      ctx.ellipse(sx, sy, 14 * t + 4, 6 * t + 2, 0, 0, Math.PI * 2);
      ctx.fill();
      drawTetrisBlock(sx, sy - dropHeight, 1);
    } else {
      const flash = Math.sin(animClock * 20) > 0;
      drawTetrisBlock(sx, sy, flash ? 1.15 : 1);
      ctx.strokeStyle = 'rgba(255,60,60,0.8)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sx, sy, 20, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

function getUpgradeCost(def) {
  return Math.round(def.baseCost * Math.pow(def.costGrowth, upgrades[def.id]));
}

function tryBuyUpgrade(id) {
  const def = UPGRADE_DEFS.find(d => d.id === id);
  if (!def) return;
  if (def.maxLevel && upgrades[id] >= def.maxLevel) return;
  const cost = getUpgradeCost(def);
  if (player.mana >= cost) {
    player.mana -= cost;
    upgrades[id] += 1;
    def.apply();
  }
}

const SHOP_ROW_H = 44;
const SHOP_BUY_W = 68;
const SHOP_BUY_H = 30;

function drawShop() {

  if (modMenuOpen) {
    drawModMenuPanel();

    return;

  ctx.font = 'bold 15px Consolas, monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`◆ ${player.mana}`, panelX + panelW - 18, panelY + 30);
  ctx.textAlign = 'left';

  // tabs
  const tabW = (panelW - 36) / 2;
  const tabY = panelY + 42;
  const tabH = 28;
  [['upgrades', 'Upgrades'], ['equipment', 'Equipment']].forEach(([id, label], i) => {
    const tx = panelX + 18 + i * tabW;

    ctx.fillStyle = active ? '#4a3221' : 'rgba(255,255,255,0.05)';

  });

      const rowY = bodyStartY + i * SHOP_ROW_H;

      const btnX = panelX + panelW - 18 - SHOP_BUY_W;

      if (!owned) {

        ctx.fillRect(btnX, btnY, SHOP_BUY_W, SHOP_BUY_H);

        ctx.fillStyle = equipped ? '#5a3a1f' : 'rgba(255,255,255,0.08)';

        ctx.font = 'bold 11px Consolas, monospace';
        ctx.textAlign = 'center';

  ctx.textAlign = 'left';
  ctx.restore();

  shopButtonRects = rects;

// small helper for wrapping the equipment description onto multiple lines
function wrapText(text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  let cy = y;
  for (const word of words) {
    const test = line + word + ' ';
    if (ctx.measureText(test).width > maxWidth && line !== '') {
      ctx.fillText(line, x, cy);
      line = word + ' ';
      cy += lineHeight;
    } else {
      line = test;
    }
  }
  ctx.fillText(line, x, cy);
}

function handleShopClick(x, y) {
  if (modMenuOpen) {
    handleModMenuClick(x, y);
    return;
  }

  // secret invisible hotspot in the top-left corner of the shop panel — opens
  // the accessibility mod menu. Deliberately undrawn.
  if (x >= shopPanelBounds.x + 2 && x <= shopPanelBounds.x + 28 &&
      y >= shopPanelBounds.y + 2 && y <= shopPanelBounds.y + 28) {
    modMenuOpen = true;
    return;
  }

  for (const btn of shopButtonRects) {
    if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
      if (btn.action === 'startWave') {
        startWave(wave + 1);
      } else if (btn.action === 'buy') {
        tryBuyUpgrade(btn.upgradeId);
      } else if (btn.action === 'switchTab') {
        shopTab = btn.tab;
      } else if (btn.action === 'buyEquip') {
        const def = EQUIPMENT_DEFS.find(d => d.id === btn.equipId);
        if (def && !def.isOwned() && player.mana >= def.cost) {
          player.mana -= def.cost;
          def.buy();
        }
      } else if (btn.action === 'toggleEquip') {
        const def = EQUIPMENT_DEFS.find(d => d.id === btn.equipId);
        if (def && def.isOwned()) def.toggle();
      }
      break;
    }
  }
}

function handleModMenuClick(x, y) {
  for (const btn of modMenuButtonRects) {
    if (x >= btn.x && x <= btn.x + btn.w && y >= btn.y && y <= btn.y + btn.h) {
      if (btn.action === 'close') {
        modMenuOpen = false;
      } else if (btn.action === 'toggle') {
        if (btn.id === 'godMode') godMode = !godMode;
        else if (btn.id === 'infiniteAmmo') infiniteAmmo = !infiniteAmmo;
      } else if (btn.action === 'stat') {
        const row = MOD_MENU_ROWS[btn.rowIndex];
        row.set(row.step * btn.dir);
      }
      break;
    }
  }
}

// --- Pong side-game (screen space) — an equippable shop item, not always active ---
const PONG_BASE_SPEED = 200;
const PONG_MAX_SPEED = 750;
const PONG_RAMP_DURATION = 10;
const PONG_BASE_RADIUS = 8;
const PONG_MAX_RADIUS = 34;
const PADDLE_W = 12;
const PADDLE_H = 90;
const PADDLE_INSET = 18;
const PADDLE_SPEED = 620;          // slower than before — paddles can't snap to the ball instantly
const PADDLE_REACTION_DELAY = 0.32; // seconds — paddles react to where the ball WAS, not where it is now

const paddleLeft = { y: canvas.height / 2 - PADDLE_H / 2 };
const paddleRight = { y: canvas.height / 2 - PADDLE_H / 2 };

// rolling history of the ball's y-position so paddles can track a "delayed" reading
let gameTime = 0;
const ballHistory = [];

function makeBall() {
  const angle = (Math.random() * 0.6 - 0.3) + (Math.random() < 0.5 ? 0 : Math.PI);
  return {
    x: canvas.width / 2,
    y: canvas.height / 2,
    dirX: Math.cos(angle),
    dirY: Math.sin(angle) || 0.3,
    age: 0
  };
}
let pongBall = makeBall();

function resetBall() {
  pongBall = makeBall();
  ballHistory.length = 0;
}

const PONG_EXPLOSION_BULLETS = 16;

function explodePongBall(camX, camY) {
  // convert the ball's screen position into world space so the fragments
  // travel and collide the same way normal player bullets do
  const worldX = pongBall.x + camX;
  const worldY = pongBall.y + camY;
  for (let i = 0; i < PONG_EXPLOSION_BULLETS; i++) {
    const angle = (i / PONG_EXPLOSION_BULLETS) * Math.PI * 2 + Math.random() * 0.15;
    const spd = BULLET_SPEED * (0.6 + Math.random() * 0.7);
    bullets.push({
      x: worldX,
      y: worldY,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 0.8
    });
  }
  resetBall();
}

function delayedBallY() {
  const targetT = gameTime - PADDLE_REACTION_DELAY;
  for (let i = 0; i < ballHistory.length; i++) {
    if (ballHistory[i].t >= targetT) return ballHistory[i].y;
  }
  return ballHistory.length ? ballHistory[0].y : pongBall.y;
}

function updatePong(dt) {
  gameTime += dt;
  pongBall.age += dt;
  const intensity = Math.min(pongBall.age / PONG_RAMP_DURATION, 1);
  const speed = PONG_BASE_SPEED + intensity * (PONG_MAX_SPEED - PONG_BASE_SPEED);
  const radius = PONG_BASE_RADIUS + intensity * (PONG_MAX_RADIUS - PONG_BASE_RADIUS);
  pongBall.radius = radius;
  pongBall.speed = speed;

  pongBall.x += pongBall.dirX * speed * dt;
  pongBall.y += pongBall.dirY * speed * dt;

  // record ball position for delayed paddle tracking
  ballHistory.push({ t: gameTime, y: pongBall.y });
  while (ballHistory.length > 1 && ballHistory[0].t < gameTime - 1) ballHistory.shift();

  // bounce top/bottom
  if (pongBall.y - radius < 0) {
    pongBall.y = radius;
    pongBall.dirY = Math.abs(pongBall.dirY);
  } else if (pongBall.y + radius > canvas.height) {
    pongBall.y = canvas.height - radius;
    pongBall.dirY = -Math.abs(pongBall.dirY);
  }

  // paddle AI tracking — chases a LAGGED reading of the ball's position, so it's
  // consistently a bit behind, especially once the ball speeds up
  const laggedY = delayedBallY();
  const targetL = laggedY - PADDLE_H / 2;
  paddleLeft.y += Math.max(-PADDLE_SPEED * dt, Math.min(PADDLE_SPEED * dt, targetL - paddleLeft.y));
  paddleLeft.y = Math.max(0, Math.min(canvas.height - PADDLE_H, paddleLeft.y));

  const targetR = laggedY - PADDLE_H / 2;
  paddleRight.y += Math.max(-PADDLE_SPEED * dt, Math.min(PADDLE_SPEED * dt, targetR - paddleRight.y));
  paddleRight.y = Math.max(0, Math.min(canvas.height - PADDLE_H, paddleRight.y));

  // bounce off left paddle (only if the lagging paddle actually got there in time)
  const leftPaddleX = PADDLE_INSET + PADDLE_W;
  if (pongBall.dirX < 0 && pongBall.x - radius <= leftPaddleX && pongBall.x - radius > PADDLE_INSET - 20 &&
      pongBall.y > paddleLeft.y - radius && pongBall.y < paddleLeft.y + PADDLE_H + radius) {
    pongBall.x = leftPaddleX + radius;
    pongBall.dirX = Math.abs(pongBall.dirX);
    const hitPos = (pongBall.y - (paddleLeft.y + PADDLE_H / 2)) / (PADDLE_H / 2);
    pongBall.dirY = Math.max(-0.85, Math.min(0.85, pongBall.dirY + hitPos * 0.4));
  }
  // bounce off right paddle
  const rightPaddleX = canvas.width - PADDLE_INSET - PADDLE_W;
  if (pongBall.dirX > 0 && pongBall.x + radius >= rightPaddleX && pongBall.x + radius < canvas.width - PADDLE_INSET + 20 &&
      pongBall.y > paddleRight.y - radius && pongBall.y < paddleRight.y + PADDLE_H + radius) {
    pongBall.x = rightPaddleX - radius;
    pongBall.dirX = -Math.abs(pongBall.dirX);
    const hitPos = (pongBall.y - (paddleRight.y + PADDLE_H / 2)) / (PADDLE_H / 2);
    pongBall.dirY = Math.max(-0.85, Math.min(0.85, pongBall.dirY + hitPos * 0.4));
  }

  // if the paddle missed entirely, the ball sails out of the arena — treat it as
  // a whiff and reset (no damage), instead of letting it fly through the middle
  if (pongBall.x < -radius - 40 || pongBall.x > canvas.width + radius + 40) {
    resetBall();
    return;
  }

  // normalize direction vector
  const dlen = Math.hypot(pongBall.dirX, pongBall.dirY) || 1;
  pongBall.dirX /= dlen;
  pongBall.dirY /= dlen;

  // collision with player (player sprite is always screen-centered)
  // note: ball always spawns at center, so we require a short grace period after
  // spawning before it's eligible to damage — otherwise every reset (including a
  // clean miss) could register as an instant hit before the ball moves away
  const px = canvas.width / 2, py = canvas.height / 2;
  const dist = Math.hypot(pongBall.x - px, pongBall.y - py);
  if (pongBall.age > 0.15 && dist < radius + player.hitRadius && player.invulnTimer <= 0) {
    damagePlayer(PONG_DAMAGE);
    player.invulnTimer = 1.2;
    resetBall();
  }
}
