// --- Game loop ---
let lastTime = performance.now();
const coordsEl = document.getElementById('coords');
let lastUiState = null;

function syncOverlayVisibility() {
  if (gameState === lastUiState) return;
  lastUiState = gameState;
  const show = gameState === 'playing';
  const display = show ? '' : 'none';
  coordsEl.style.display = display;
  canvas.style.cursor = show ? 'none' : 'default';
}

function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  animClock += dt;
  syncOverlayVisibility();

  if (gameState === 'playing') {
    update(dt);
    render();
  } else if (gameState === 'menu') {
    renderMenu();
  } else if (gameState === 'mapSelect') {
    renderMapSelect();
  }

  requestAnimationFrame(loop);
}

function update(dt) {
  if (player.invulnTimer > 0) player.invulnTimer -= dt;
  if (deathBanner && deathBanner.timer > 0) deathBanner.timer -= dt;
  if (player.rollCooldownTimer > 0) player.rollCooldownTimer -= dt;

  const { dx, dy } = getInputVector();
  const running = keys['shift'];
  const speed = running ? player.speedRun : player.speedWalk;

  let moveX, moveY, effectiveSpeed;

  if (player.rolling) {
    player.rollTimer -= dt;
    moveX = player.rollDirX;
    moveY = player.rollDirY;
    effectiveSpeed = ROLL_SPEED;
    player.moving = true;
    if (player.rollTimer <= 0) {
      player.rolling = false;
      player.rollCooldownTimer = ROLL_COOLDOWN;
    }
  } else {
    moveX = dx; moveY = dy;
    const len = Math.hypot(moveX, moveY);
    if (len > 0) {
      moveX /= len;
      moveY /= len;
      player.moving = true;
      if (Math.abs(dx) > Math.abs(dy)) {
        player.dir = dx > 0 ? 'right' : 'left';
      } else if (dy !== 0) {
        player.dir = dy > 0 ? 'down' : 'up';
      }
    } else {
      player.moving = false;
    }
    effectiveSpeed = speed;
  }

  const nx = player.x + moveX * effectiveSpeed * dt;
  const ny = player.y + moveY * effectiveSpeed * dt;
  if (canMoveTo(nx, player.y)) player.x = nx;
  if (canMoveTo(player.x, ny)) player.y = ny;

  player.x = Math.max(TILE / 2, Math.min(MAP_W * TILE - TILE / 2, player.x));
  player.y = Math.max(TILE / 2, Math.min(MAP_H * TILE - TILE / 2, player.y));

  // --- map hazards: conveyor belts push the player, flame tiles kill instantly, cacti sting ---
  const curTX = Math.floor(player.x / TILE);
  const curTY = Math.floor(player.y / TILE);
  const curTileRow = world[curTY];
  const curTile = curTileRow ? curTileRow[curTX] : null;

  if (curTile === TILE_CONVEYOR) {
    const pushY = player.y + CONVEYOR_SPEED * dt;
    if (canMoveTo(player.x, pushY)) player.y = pushY;
  }
  if (curTile === TILE_FLAME && player.invulnTimer <= 0) {
    if (!godMode) player.health = 0;
  }
  if (curTile === TILE_CACTUS && player.invulnTimer <= 0) {
    damagePlayer(CACTUS_DAMAGE);
    player.invulnTimer = 0.5;
  }

  if (player.moving) {
    player.animTimer += dt * (running ? 10 : 7);
    player.animFrame = Math.floor(player.animTimer) % 4;
  } else {
    player.animTimer = 0;
    player.animFrame = 0;
  }

  document.getElementById('coords').textContent =
    `tile: (${Math.floor(player.x / TILE)}, ${Math.floor(player.y / TILE)})`;

  fireTimer -= dt;
  if (wantsToShoot && fireTimer <= 0 && waveState === 'active') {
    fireTimer = infiniteAmmo ? 0.03 : FIRE_COOLDOWN;
    fireShotgun();
  }

  // camera offset (world -> screen), needed to compare world-space bullets
  // against the screen-space pong ball
  const camX = player.x - canvas.width / 2;
  const camY = player.y - canvas.height / 2;

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;

    let hit = false;
    let explodeX = null, explodeY = null;

    // did this bullet pop the pong ball? (grace period stops a freshly-spawned
    // ball — which always appears at your position, same as new bullets — from
    // being re-popped instantly and chain-exploding into an infinite cascade)
    const bScreenX = b.x - camX;
    const bScreenY = b.y - camY;
    if (pongEquipped && pongBall.age > 0.15 && Math.hypot(bScreenX - pongBall.x, bScreenY - pongBall.y) < pongBall.radius + BULLET_RADIUS) {
      explodePongBall(camX, camY);
      hit = true;
    }

    if (!hit) {
      for (const e of enemies) {
        if (Math.hypot(b.x - e.x, b.y - e.y) < e.radius + BULLET_RADIUS) {
          if (b.explosive) {
            explodeX = b.x; explodeY = b.y;
          } else {
            e.hp -= (b.damage !== undefined ? b.damage : BULLET_DAMAGE);
            e.hitFlash = 0.15;
          }
          hit = true;
          break;
        }
      }
    }

    if (!hit) {
      for (let bzi = banzais.length - 1; bzi >= 0; bzi--) {
        const bz = banzais[bzi];
        if (Math.hypot(b.x - bz.x, b.y - bz.y) < bz.radius + BULLET_RADIUS) {
          if (b.explosive) {
            explodeX = b.x; explodeY = b.y;
          } else {
            bz.hp -= (b.damage !== undefined ? b.damage : BULLET_DAMAGE);
            bz.hitFlash = 0.15;
            if (bz.hp <= 0) {
              spawnManaDrop(bz.x, bz.y, BANZAI_MANA_MIN, BANZAI_MANA_MAX);
              banzais.splice(bzi, 1);
            }
          }
          hit = true;
          break;
        }
      }
    }

    if (!hit && boss && Math.hypot(b.x - boss.x, b.y - boss.y) < boss.radius + BULLET_RADIUS) {
      if (b.explosive) {
        explodeX = b.x; explodeY = b.y;
      } else {
        boss.hp -= (b.damage !== undefined ? b.damage : BULLET_DAMAGE);
        boss.hitFlash = 0.15;
      }
      hit = true;
    }

    const tx = Math.floor(b.x / TILE);
    const ty = Math.floor(b.y / TILE);
    const wallBlocked = isBulletBlocked(tx, ty);

    if (!hit && wallBlocked && b.explosive) {
      explodeX = b.x; explodeY = b.y;
      hit = true;
    }

    if (explodeX !== null) {
      explodeAt(explodeX, explodeY, b.explosionRadius || 60, BULLET_DAMAGE);
    }

    if (hit || b.life <= 0 || wallBlocked) {
      bullets.splice(i, 1);
    }
  }

  updateExplosions(dt);

  // safety valve: never let bullets pile up without bound, no matter the cause
  const MAX_BULLETS = 300;
  if (bullets.length > MAX_BULLETS) {
    bullets.splice(0, bullets.length - MAX_BULLETS);
  }

  updateEnemies(dt);
  updateBanzais(dt);
  updateBoss(dt);
  if (waveState === 'active' && pongEquipped) updatePong(dt);
  updateSnake(dt);
  if (waveState === 'active') updateTetris(dt);
  if (waveState === 'active') updateMelee(dt);

  if (player.health <= 0) {
    player.health = player.maxHealth;
    player.x = SPAWN_X;
    player.y = SPAWN_Y;
    player.invulnTimer = 2.0;
    player.lives -= 1;
    if (player.lives > 0) {
      deathBanner = { text: `Life lost! ${player.lives} ${player.lives === 1 ? 'life' : 'lives'} remaining`, timer: 2.4, fadeTotal: 2.4 };
    } else {
      player.lives = PLAYER_MAX_LIVES;
      deathBanner = { text: `Out of lives — waves restarting`, timer: 2.4, fadeTotal: 2.4 };
      restartWaves();
    }
  }
}

function restartWaves() {
  bullets.length = 0;
  enemies.length = 0;
  manaDrops.length = 0;
  respawnQueue.length = 0;
  enemyBullets.length = 0;
  lasers.length = 0;
  banzais.length = 0;
  banzaiTimer = 6;
  tetrisPieces.length = 0;
  explosions.length = 0;
  startWave(1);
}

function tileColor(t) {
  switch (t) {
    case TILE_GRASS: return '#3f6b3a';
    case TILE_GRASS2: return '#4a7a44';
    case TILE_PATH: return '#b89b6a';
    case TILE_WATER: return '#3a6ea5';
    case TILE_TREE: return '#3f6b3a';
    case TILE_FLOOR: return '#4a4a52';
    case TILE_WALL: return '#26262c';
    case TILE_CONVEYOR: return '#5a5230';
    case TILE_FLAME: return '#3a1210';
    case TILE_SAND: return '#d9b676';
    case TILE_SAND2: return '#e0c489';
    case TILE_CACTUS: return '#d9b676';
    default: return '#3f6b3a';
  }
}

function render() {
  let shakeX = 0, shakeY = 0;
  if (boss && boss.proximity > 0) {
    const shakeMag = boss.proximity * 10;
    shakeX = (Math.random() - 0.5) * 2 * shakeMag;
    shakeY = (Math.random() - 0.5) * 2 * shakeMag;
  }
  const camX = Math.round(player.x - canvas.width / 2 + shakeX);
  const camY = Math.round(player.y - canvas.height / 2 + shakeY);

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const startTX = Math.max(0, Math.floor(camX / TILE));
  const endTX = Math.min(MAP_W, Math.ceil((camX + canvas.width) / TILE) + 1);
  const startTY = Math.max(0, Math.floor(camY / TILE));
  const endTY = Math.min(MAP_H, Math.ceil((camY + canvas.height) / TILE) + 1);

  for (let ty = startTY; ty < endTY; ty++) {
    for (let tx = startTX; tx < endTX; tx++) {
      const t = world[ty][tx];
      const sx = tx * TILE - camX;
      const sy = ty * TILE - camY;
      ctx.fillStyle = tileColor(t);
      ctx.fillRect(sx, sy, TILE, TILE);
      if (t === TILE_WATER) {
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillRect(sx + 4, sy + 6, TILE - 8, 3);
      }
      if (t === TILE_WALL) {
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
        ctx.fillStyle = 'rgba(0,0,0,0.3)';
        ctx.fillRect(sx, sy + TILE - 4, TILE, 4);
      }
      if (t === TILE_CONVEYOR) {
        // moving chevrons pointing south (the direction it pushes)
        ctx.fillStyle = 'rgba(255, 210, 90, 0.55)';
        const offset = (animClock * 40) % TILE;
        for (let cy = -TILE; cy < TILE * 2; cy += TILE) {
          const yy = sy + cy + offset;
          ctx.beginPath();
          ctx.moveTo(sx + 4, yy);
          ctx.lineTo(sx + TILE / 2, yy + 8);
          ctx.lineTo(sx + TILE - 4, yy);
          ctx.lineTo(sx + TILE / 2, yy + 3);
          ctx.closePath();
          ctx.fill();
        }
      }
      if (t === TILE_FLAME) {
        const flick = 0.7 + Math.sin(animClock * 9 + tx * 1.7 + ty * 2.1) * 0.3;
        const grad = ctx.createRadialGradient(
          sx + TILE / 2, sy + TILE / 2, 2,
          sx + TILE / 2, sy + TILE / 2, TILE / 1.3
        );
        grad.addColorStop(0, `rgba(255, 230, 120, ${0.9 * flick})`);
        grad.addColorStop(0.4, `rgba(255, 140, 40, ${0.85 * flick})`);
        grad.addColorStop(1, 'rgba(120, 20, 10, 0.2)');
        ctx.fillStyle = grad;
        ctx.fillRect(sx, sy, TILE, TILE);
      }
    }
  }

  const drawables = [];
  for (let ty = startTY; ty < endTY; ty++) {
    for (let tx = startTX; tx < endTX; tx++) {
      if (world[ty][tx] === TILE_TREE) {
        drawables.push({ y: ty * TILE + TILE, draw: () => drawTree(tx * TILE - camX, ty * TILE - camY) });
      } else if (world[ty][tx] === TILE_CACTUS) {
        drawables.push({ y: ty * TILE + TILE, draw: () => drawCactus(tx * TILE - camX, ty * TILE - camY) });
      }
    }
  }
  for (const e of enemies) {
    drawables.push({ y: e.y, draw: () => drawEnemy(e, camX, camY) });
  }
  for (const bz of banzais) {
    drawables.push({ y: bz.y, draw: () => drawBanzai(bz, camX, camY) });
  }
  if (boss) {
    drawables.push({ y: boss.y, draw: () => drawBoss(camX, camY) });
  }
  for (const m of manaDrops) {
    drawables.push({ y: m.y - 20, draw: () => drawManaDrop(m, camX, camY) });
  }
  if (snakeEquipped) {
    for (const a of apples) {
      drawables.push({ y: a.y - 6, draw: () => drawApple(a, camX, camY) });
    }
    drawables.push({ y: snakeHead.y, draw: () => drawSnake(camX, camY) });
  }
  drawables.push({ y: player.y + player.h / 2, draw: () => drawPlayer(camX, camY) });
  drawables.sort((a, b) => a.y - b.y);
  drawables.forEach(d => d.draw());

  drawMeleeSwing(camX, camY);
  drawBullets(camX, camY);
  drawEnemyProjectiles(camX, camY);
  drawExplosions(camX, camY);
  drawTetrisPieces(camX, camY);
  if (pongEquipped) drawPong();

  if (boss && boss.proximity > 0) {
    ctx.fillStyle = `rgba(180, 20, 20, ${boss.proximity * 0.32})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  drawHUD();
  drawBossHealthBar();
  drawWaveBanner();
  drawDeathBanner();
  drawShop();
  drawCrosshair();
}

function drawTree(sx, sy) {
  ctx.fillStyle = '#4a3221';
  ctx.fillRect(sx + 13, sy + 20, 6, 10);
  ctx.fillStyle = '#2c4a29';
  ctx.beginPath();
  ctx.arc(sx + 16, sy + 12, 14, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#375c33';
  ctx.beginPath();
  ctx.arc(sx + 11, sy + 8, 9, 0, Math.PI * 2);
  ctx.fill();
}

function drawCactus(sx, sy) {
  const cx = sx + 16, baseY = sy + 28;
  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(cx, baseY, 10, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#3a7a4a';
  ctx.strokeStyle = '#245530';
  ctx.lineWidth = 1.5;

  // main trunk
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(cx - 4, baseY - 24, 8, 24, 3) : ctx.rect(cx - 4, baseY - 24, 8, 24);
  ctx.fill();
  ctx.stroke();

  // left arm
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(cx - 12, baseY - 16, 6, 12, 3) : ctx.rect(cx - 12, baseY - 16, 6, 12);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(cx - 12, baseY - 20, 6, 8, 3) : ctx.rect(cx - 12, baseY - 20, 6, 8);
  ctx.fill();
  ctx.stroke();

  // right arm
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(cx + 6, baseY - 19, 6, 11, 3) : ctx.rect(cx + 6, baseY - 19, 6, 11);
  ctx.fill();
  ctx.stroke();
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(cx + 6, baseY - 24, 6, 8, 3) : ctx.rect(cx + 6, baseY - 24, 6, 8);
  ctx.fill();
  ctx.stroke();

  // spines (little warning ticks)
  ctx.strokeStyle = '#e8d9a0';
  ctx.lineWidth = 1;
  for (let i = 0; i < 6; i++) {
    const yy = baseY - 22 + i * 4;
    ctx.beginPath();
    ctx.moveTo(cx - 5, yy);
    ctx.lineTo(cx - 7, yy - 1);
    ctx.moveTo(cx + 5, yy);
    ctx.lineTo(cx + 7, yy - 1);
    ctx.stroke();
  }
}

function drawEnemy(e, camX, camY) {
  const sx = Math.round(e.x - camX);
  const sy = Math.round(e.y - camY);

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(sx, sy + e.radius - 2, e.radius * 0.8, e.radius * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();

  if (e.type === 'shooter' || e.type === 'gunner') {
    drawShooterEnemy(e, sx, sy);
  } else if (e.type === 'laser' || e.type === 'heavylaser') {
    drawLaserEnemy(e, sx, sy);
  } else if (e.type === 'brute' || e.type === 'warbrute') {
    drawBruteEnemy(e, sx, sy);
  } else {
    drawBlobEnemy(e, sx, sy);
  }

  // health bar
  const barW = e.radius * 2.4;
  const pct = Math.max(0, e.hp / e.maxHp);
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(sx - barW / 2, sy - e.radius - 12, barW, 4);
  ctx.fillStyle = '#e05a4f';
  ctx.fillRect(sx - barW / 2, sy - e.radius - 12, barW * pct, 4);
}

function drawBlobEnemy(e, sx, sy) {
  const elite = e.type === 'megablob';
  ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : (elite ? '#5c1a24' : '#8a2f3a');
  ctx.beginPath();
  ctx.arc(sx, sy, e.radius, 0, Math.PI * 2);
  ctx.fill();

  if (elite) {
    ctx.strokeStyle = '#2e0a10';
    ctx.lineWidth = 2;
    ctx.stroke();
    // spikes
    ctx.fillStyle = '#3a0f16';
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 4) {
      const bx = sx + Math.cos(a) * (e.radius - 2);
      const by = sy + Math.sin(a) * (e.radius - 2);
      const tx = sx + Math.cos(a) * (e.radius + 6);
      const ty = sy + Math.sin(a) * (e.radius + 6);
      ctx.beginPath();
      ctx.moveTo(bx + Math.cos(a + 1.5) * 3, by + Math.sin(a + 1.5) * 3);
      ctx.lineTo(tx, ty);
      ctx.lineTo(bx - Math.cos(a + 1.5) * 3, by - Math.sin(a + 1.5) * 3);
      ctx.closePath();
      ctx.fill();
    }
  }

  ctx.fillStyle = '#1a0a0c';
  ctx.beginPath();
  ctx.arc(sx - 4, sy - 2, 2, 0, Math.PI * 2);
  ctx.arc(sx + 4, sy - 2, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#1a0a0c';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(sx, sy + 3, 4, 0, Math.PI);
  ctx.stroke();
}

function drawShooterEnemy(e, sx, sy) {
  const elite = e.type === 'gunner';
  // body
  ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : (elite ? '#7a3a1f' : '#a06a3a');
  ctx.beginPath();
  ctx.arc(sx, sy, e.radius, 0, Math.PI * 2);
  ctx.fill();
  if (elite) {
    ctx.strokeStyle = '#3a1a0a';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // eyes
  ctx.fillStyle = '#1a0a0c';
  ctx.beginPath();
  ctx.arc(sx - 4, sy - 1, 2, 0, Math.PI * 2);
  ctx.arc(sx + 4, sy - 1, 2, 0, Math.PI * 2);
  ctx.fill();

  // cowboy hat: brim + crown
  ctx.fillStyle = elite ? '#2a1a0f' : '#5a3a1f';
  ctx.beginPath();
  ctx.ellipse(sx, sy - e.radius + 2, e.radius * 1.15, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = elite ? '#3a2415' : '#6b4526';
  ctx.beginPath();
  ctx.moveTo(sx - e.radius * 0.55, sy - e.radius + 1);
  ctx.lineTo(sx - e.radius * 0.4, sy - e.radius - 9);
  ctx.lineTo(sx + e.radius * 0.4, sy - e.radius - 9);
  ctx.lineTo(sx + e.radius * 0.55, sy - e.radius + 1);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#3a2412';
  ctx.lineWidth = 1;
  ctx.stroke();

  if (elite) {
    // silver hat band to mark the elite gunner
    ctx.fillStyle = '#c9c9c9';
    ctx.fillRect(sx - e.radius * 0.4, sy - e.radius - 3, e.radius * 0.8, 2.5);
  }
}

function drawLaserEnemy(e, sx, sy) {
  const elite = e.type === 'heavylaser';
  ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : (elite ? '#3a2a5a' : '#4a3a7a');
  ctx.beginPath();
  ctx.arc(sx, sy, e.radius, 0, Math.PI * 2);
  ctx.fill();
  if (elite) {
    ctx.strokeStyle = '#1a1030';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // visor (bigger + orange-tinted for the elite variant)
  const glow = e.telegraphActive ? (0.6 + Math.sin(animClock * 30) * 0.4) : 0.5;
  ctx.fillStyle = elite ? `rgba(255, 140, 40, ${glow})` : `rgba(255, 70, 70, ${glow})`;
  const visorW = elite ? 16 : 12;
  ctx.fillRect(sx - visorW / 2, sy - 3, visorW, elite ? 6 : 4);

  // telegraph aiming line (thicker for the elite beam)
  if (e.telegraphActive) {
    const dirX = Math.cos(e.aimAngle), dirY = Math.sin(e.aimAngle);
    ctx.strokeStyle = elite
      ? `rgba(255, 140, 40, ${0.4 + Math.sin(animClock * 25) * 0.3})`
      : `rgba(255, 60, 60, ${0.35 + Math.sin(animClock * 25) * 0.25})`;
    ctx.lineWidth = elite ? 4 : 2;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + dirX * 400, sy + dirY * 400);
    ctx.stroke();
  }
}

function drawBruteEnemy(e, sx, sy) {
  const elite = e.type === 'warbrute';
  const def = ENEMY_TYPES[e.type];

  // smash telegraph ring (expanding warning circle)
  if (e.telegraphActive) {
    const t = 1 - Math.max(0, e.telegraphTimer / def.smashTelegraph);
    ctx.strokeStyle = `rgba(255, 120, 60, ${0.7 - t * 0.5})`;
    ctx.lineWidth = elite ? 4 : 3;
    ctx.beginPath();
    ctx.arc(sx, sy, def.smashRadius * t, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.fillStyle = e.hitFlash > 0 ? '#ffffff' : (elite ? '#3a1610' : '#5a2418');
  ctx.beginPath();
  ctx.arc(sx, sy, e.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#2e0f0a';
  ctx.lineWidth = elite ? 3 : 2;
  ctx.stroke();

  if (elite) {
    // shoulder spikes
    ctx.fillStyle = '#7a1a10';
    for (const a of [-0.9, 0.9]) {
      const bx = sx + Math.cos(a) * (e.radius - 3);
      const by = sy + Math.sin(a) * (e.radius - 3);
      ctx.beginPath();
      ctx.moveTo(bx - 4, by);
      ctx.lineTo(bx, by - 10);
      ctx.lineTo(bx + 4, by);
      ctx.closePath();
      ctx.fill();
    }
  }

  ctx.fillStyle = '#1a0a0c';
  ctx.beginPath();
  ctx.arc(sx - 5, sy - 2, 2.5, 0, Math.PI * 2);
  ctx.arc(sx + 5, sy - 2, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#1a0a0c';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(sx, sy + 4, 5, 0.15 * Math.PI, 0.85 * Math.PI);
  ctx.stroke();
}

function drawBanzai(bz, camX, camY) {
  const sx = Math.round(bz.x - camX);
  const sy = Math.round(bz.y - camY);
  const angle = Math.atan2(bz.vy, bz.vx);

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(angle);

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(0, bz.radius * 0.5, bz.radius * 0.9, bz.radius * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();

  // body (bullet silhouette, nose pointing along travel direction)
  ctx.fillStyle = bz.hitFlash > 0 ? '#ffffff' : '#1a1a1a';
  ctx.beginPath();
  ctx.moveTo(bz.radius * 1.3, 0);
  ctx.quadraticCurveTo(bz.radius * 0.6, -bz.radius, -bz.radius, -bz.radius * 0.75);
  ctx.lineTo(-bz.radius * 1.15, 0);
  ctx.lineTo(-bz.radius, bz.radius * 0.75);
  ctx.quadraticCurveTo(bz.radius * 0.6, bz.radius, bz.radius * 1.3, 0);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.stroke();

  // menacing eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(bz.radius * 0.15, -bz.radius * 0.25, bz.radius * 0.22, 0, Math.PI * 2);
  ctx.arc(bz.radius * 0.15, bz.radius * 0.25, bz.radius * 0.22, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#c0201a';
  ctx.beginPath();
  ctx.arc(bz.radius * 0.28, -bz.radius * 0.25, bz.radius * 0.11, 0, Math.PI * 2);
  ctx.arc(bz.radius * 0.28, bz.radius * 0.25, bz.radius * 0.11, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();

  // health bar
  const barW = bz.radius * 2.6;
  const pct = Math.max(0, bz.hp / bz.maxHp);
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(sx - barW / 2, sy - bz.radius - 16, barW, 5);
  ctx.fillStyle = '#e05a4f';
  ctx.fillRect(sx - barW / 2, sy - bz.radius - 16, barW * pct, 5);
}

function drawBoss(camX, camY) {
  if (!boss) return;
  const sx = Math.round(boss.x - camX);
  const sy = Math.round(boss.y - camY);

  // falling-branch warning zones (drawn first, under the boss)
  for (const br of boss.branches) {
    const bsx = Math.round(br.x - camX), bsy = Math.round(br.y - camY);
    const t = 1 - Math.max(0, br.timer / br.maxTimer);
    ctx.strokeStyle = `rgba(200, 60, 40, ${0.5 + Math.sin(animClock * 20) * 0.3})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(bsx, bsy, 34 * (0.4 + t * 0.6), 0, Math.PI * 2);
    ctx.stroke();
    ctx.fillStyle = `rgba(200, 60, 40, ${0.12})`;
    ctx.beginPath();
    ctx.arc(bsx, bsy, 34, 0, Math.PI * 2);
    ctx.fill();
  }

  // smash telegraph ring
  if (boss.telegraphActive && boss.currentAttack === 'slam') {
    const t = 1 - Math.max(0, boss.telegraphTimer / 0.8);
    ctx.strokeStyle = `rgba(255, 140, 60, ${0.7 - t * 0.4})`;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(sx, sy, 115 * t, 0, Math.PI * 2);
    ctx.stroke();
  }

  // shadow
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(sx, sy + boss.radius - 4, boss.radius * 0.9, boss.radius * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();

  const flash = boss.hitFlash > 0;
  const wobble = Math.sin(animClock * 2.2) * 4;

  if (bossFaceLoaded) {
    const size = boss.radius * 2.3;
    ctx.save();
    ctx.beginPath();
    ctx.arc(sx, sy, boss.radius, 0, Math.PI * 2);
    ctx.clip();
    ctx.translate(wobble * 0.2, 0);
    ctx.drawImage(bossFaceImg, sx - size / 2, sy - size / 2, size, size);
    ctx.restore();

    ctx.strokeStyle = flash ? '#ffffff' : '#2a1c10';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(sx, sy, boss.radius, 0, Math.PI * 2);
    ctx.stroke();

    if (flash) {
      ctx.fillStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath();
      ctx.arc(sx, sy, boss.radius, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    // fallback procedural tree face if the image hasn't loaded yet
    ctx.fillStyle = flash ? '#ffffff' : '#4a3221';
    ctx.beginPath();
    ctx.arc(sx, sy, boss.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#2a1c10';
    ctx.lineWidth = 3;
    ctx.stroke();

    ctx.fillStyle = flash ? '#8a2f3a' : '#ffcf5c';
    ctx.beginPath();
    ctx.arc(sx - 12, sy - 4, 6, 0, Math.PI * 2);
    ctx.arc(sx + 12, sy - 4, 6, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawBossHealthBar() {
  if (!boss) return;
  const barW = Math.min(560, canvas.width * 0.6);
  const barH = 22;
  const bx = (canvas.width - barW) / 2;
  const by = 20;
  const pct = Math.max(0, boss.hp / boss.maxHp);

  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(bx - 4, by - 4, barW + 8, barH + 8);
  ctx.fillStyle = '#3a1414';
  ctx.fillRect(bx, by, barW, barH);
  const grad = ctx.createLinearGradient(bx, 0, bx + barW, 0);
  grad.addColorStop(0, '#3f6b3a');
  grad.addColorStop(1, '#6ac96a');
  ctx.fillStyle = grad;
  ctx.fillRect(bx, by, barW * pct, barH);
  ctx.strokeStyle = '#efe3c9';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, barW, barH);

  ctx.fillStyle = '#f4ead9';
  ctx.font = 'bold 14px Trebuchet MS, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('THE ELDER ROOT', bx + barW / 2, by + barH - 6);
  ctx.textAlign = 'left';
}

function drawEnemyProjectiles(camX, camY) {
  for (const b of enemyBullets) {
    const sx = Math.round(b.x - camX);
    const sy = Math.round(b.y - camY);
    ctx.fillStyle = '#e0433a';
    ctx.beginPath();
    ctx.arc(sx, sy, b.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#8a1a12';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  for (const l of lasers) {
    const alpha = Math.max(0, l.life / l.maxLife);
    const x1 = l.x1 - camX, y1 = l.y1 - camY;
    const x2 = l.x2 - camX, y2 = l.y2 - camY;
    ctx.strokeStyle = `rgba(255, 90, 90, ${alpha})`;
    ctx.lineWidth = 6 * alpha + 1;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.strokeStyle = `rgba(255, 220, 220, ${alpha})`;
    ctx.lineWidth = 2 * alpha + 0.5;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }
}

function drawPlayer(camX, camY) {
  const sx = Math.round(player.x - camX);
  const sy = Math.round(player.y - camY);
  const bob = player.moving ? Math.abs(Math.sin(player.animTimer * Math.PI)) * 2 : 0;

  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.beginPath();
  ctx.ellipse(sx, sy + player.h / 2 - 2, 10, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  if (player.rolling) {
    for (let i = 1; i <= 3; i++) {
      const t = i * 6;
      ctx.fillStyle = `rgba(200, 220, 255, ${0.18 / i})`;
      ctx.beginPath();
      ctx.ellipse(sx - player.rollDirX * t, sy - player.rollDirY * t, 13, 15, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  const bodyY = sy - bob;
  const SPRITE_SIZE = 30;

  const legSwing = player.moving ? Math.sin(player.animTimer * Math.PI) * 5 : 0;
  ctx.fillStyle = '#2e2a24';
  ctx.save();
  ctx.translate(sx - 5, bodyY + 11);
  ctx.rotate(legSwing * 0.05);
  ctx.fillRect(-2, 0, 4, 7);
  ctx.restore();
  ctx.save();
  ctx.translate(sx + 5, bodyY + 11);
  ctx.rotate(-legSwing * 0.05);
  ctx.fillRect(-2, 0, 4, 7);
  ctx.restore();

  const flashing = player.invulnTimer > 0 && Math.floor(player.invulnTimer * 12) % 2 === 0;

  if (spriteLoaded) {
    ctx.save();
    if (flashing) ctx.globalAlpha = 0.4;
    if (mouse.x < canvas.width / 2) {
      ctx.translate(sx, bodyY - 2);
      ctx.scale(-1, 1);
      ctx.drawImage(playerSprite, -SPRITE_SIZE / 2, -SPRITE_SIZE / 2, SPRITE_SIZE, SPRITE_SIZE);
    } else {
      ctx.drawImage(playerSprite, sx - SPRITE_SIZE / 2, bodyY - 2 - SPRITE_SIZE / 2, SPRITE_SIZE, SPRITE_SIZE);
    }
    ctx.restore();
  }
}

function drawMeleeSwing(camX, camY) {
  if (!meleeSwing) return;
  const sx = Math.round(player.x - camX);
  const sy = Math.round(player.y - camY);
  const t = 1 - Math.max(0, meleeSwing.life / meleeSwing.maxLife);
  const alpha = Math.max(0, meleeSwing.life / meleeSwing.maxLife);

  if (meleeSwing.jab) {
    // quick thrust outward toward the target, then fade
    const extend = Math.min(1, t * 2.5);
    const dist = meleeSwing.range * 0.75 * extend;
    const px = sx + Math.cos(meleeSwing.angle) * dist;
    const py = sy + Math.sin(meleeSwing.angle) * dist;

    ctx.strokeStyle = `rgba(224, 164, 120, ${alpha * 0.6})`;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(px, py);
    ctx.stroke();

    if (copperSwordLoaded) {
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(px, py);
      ctx.rotate(meleeSwing.angle + Math.PI / 4);
      const w = 40, h = 40;
      ctx.drawImage(copperSwordImg, -w / 2, -h / 2, w, h);
      ctx.restore();
    }
  } else {
    // wide sweeping slash: translucent arc wedge + the blade rotating through it
    const startA = meleeSwing.angle - meleeSwing.arc / 2;
    const endA = meleeSwing.angle + meleeSwing.arc / 2;
    const sweepA = startA + (endA - startA) * t;

    ctx.fillStyle = `rgba(200, 200, 210, ${alpha * 0.25})`;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.arc(sx, sy, meleeSwing.range, startA, sweepA);
    ctx.closePath();
    ctx.fill();

    if (breakerBladeLoaded) {
      const dist = meleeSwing.range * 0.7;
      const px = sx + Math.cos(sweepA) * dist;
      const py = sy + Math.sin(sweepA) * dist;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(px, py);
      ctx.rotate(sweepA + Math.PI / 4);
      const w = 54, h = 54;
      ctx.drawImage(breakerBladeImg, -w / 2, -h / 2, w, h);
      ctx.restore();
    }
  }
}

function drawBullets(camX, camY) {
  for (const b of bullets) {
    const sx = Math.round(b.x - camX);
    const sy = Math.round(b.y - camY);
    const angle = Math.atan2(b.vy, b.vx);

    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(angle);

    if (b.isDagger) {
      if (throwingDaggerLoaded) {
        ctx.rotate(Math.PI / 2); // art points "up" by default; align it with travel direction
        const w = 20, h = 20;
        ctx.drawImage(throwingDaggerImg, -w / 2, -h / 2, w, h);
      } else {
        ctx.fillStyle = '#c9c9c9';
        ctx.fillRect(-9, -2, 18, 4);
      }
    } else if (b.explosive) {
      ctx.fillStyle = 'rgba(255, 140, 60, 0.5)';
      ctx.fillRect(-22, -4, 22, 8);
      ctx.fillStyle = '#3a3a3a';
      ctx.fillRect(-10, -5, 16, 10);
      ctx.fillStyle = '#c0392b';
      ctx.beginPath();
      ctx.moveTo(6, -5);
      ctx.lineTo(14, 0);
      ctx.lineTo(6, 5);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#222';
      ctx.fillRect(-13, -6, 4, 12);
    } else {
      ctx.fillStyle = 'rgba(255, 200, 90, 0.5)';
      ctx.fillRect(-16, -3, 16, 6);
      ctx.fillStyle = '#ffcf5c';
      ctx.beginPath();
      ctx.arc(0, 0, BULLET_RADIUS, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#7a4d10';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }
    ctx.restore();
  }
}

// --- Explosions (RPG / Mega RPG impact AOE) ---
const explosions = [];

function explodeAt(x, y, radius, damage) {
  for (const e of enemies) {
    if (Math.hypot(e.x - x, e.y - y) < radius + e.radius) {
      e.hp -= damage;
      e.hitFlash = 0.15;
    }
  }
  for (let i = banzais.length - 1; i >= 0; i--) {
    const bz = banzais[i];
    if (Math.hypot(bz.x - x, bz.y - y) < radius + bz.radius) {
      bz.hp -= damage;
      bz.hitFlash = 0.15;
      if (bz.hp <= 0) {
        spawnManaDrop(bz.x, bz.y, BANZAI_MANA_MIN, BANZAI_MANA_MAX);
        banzais.splice(i, 1);
      }
    }
  }
  if (boss && Math.hypot(boss.x - x, boss.y - y) < radius + boss.radius) {
    boss.hp -= damage;
    boss.hitFlash = 0.15;
  }
  explosions.push({ x, y, radius, life: 0.35, maxLife: 0.35 });
}

function updateExplosions(dt) {
  for (let i = explosions.length - 1; i >= 0; i--) {
    explosions[i].life -= dt;
    if (explosions[i].life <= 0) explosions.splice(i, 1);
  }
}

function drawExplosions(camX, camY) {
  for (const ex of explosions) {
    const sx = Math.round(ex.x - camX);
    const sy = Math.round(ex.y - camY);
    const t = 1 - Math.max(0, ex.life / ex.maxLife); // 0 -> 1 as it expands/fades
    const r = ex.radius * (0.3 + t * 0.8);
    const alpha = 1 - t;

    const grad = ctx.createRadialGradient(sx, sy, 0, sx, sy, r);
    grad.addColorStop(0, `rgba(255, 240, 180, ${0.9 * alpha})`);
    grad.addColorStop(0.5, `rgba(255, 130, 40, ${0.7 * alpha})`);
    grad.addColorStop(1, `rgba(120, 20, 10, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawPong() {
  // paddles
  ctx.fillStyle = '#e8e2d6';
  ctx.fillRect(PADDLE_INSET, paddleLeft.y, PADDLE_W, PADDLE_H);
  ctx.fillRect(canvas.width - PADDLE_INSET - PADDLE_W, paddleRight.y, PADDLE_W, PADDLE_H);

  // center dashed line (pong vibe)
  ctx.strokeStyle = 'rgba(232,226,214,0.15)';
  ctx.lineWidth = 2;
  ctx.setLineDash([10, 10]);
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);

  // ball
  ctx.fillStyle = '#f2f2f2';
  ctx.beginPath();
  ctx.arc(pongBall.x, pongBall.y, pongBall.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#b8b0a0';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawWaveBanner() {
  if (!waveBanner || waveBanner.timer <= 0) return;
  const alpha = Math.max(0, Math.min(1, waveBanner.timer / Math.min(0.6, waveBanner.fadeTotal)));
  const cx = canvas.width / 2;
  const cy = canvas.height * 0.28;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';

  ctx.font = 'bold 30px Trebuchet MS, sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillText(waveBanner.title, cx + 2, cy + 2);
  ctx.fillStyle = '#e0a458';
  ctx.fillText(waveBanner.title, cx, cy);

  ctx.font = 'bold 15px Consolas, monospace';
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillText(waveBanner.sub, cx + 1, cy + 27);
  ctx.fillStyle = '#f4ead9';
  ctx.fillText(waveBanner.sub, cx, cy + 26);

  ctx.restore();
  ctx.textAlign = 'left';
}

function drawCrosshair() {
  ctx.strokeStyle = 'rgba(244, 234, 217, 0.8)';
  ctx.lineWidth = 1.5;
  const r = 8;
  ctx.beginPath();
  ctx.arc(mouse.x, mouse.y, r, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(mouse.x - r - 5, mouse.y);
  ctx.lineTo(mouse.x - r + 2, mouse.y);
  ctx.moveTo(mouse.x + r - 2, mouse.y);
  ctx.lineTo(mouse.x + r + 5, mouse.y);
  ctx.moveTo(mouse.x, mouse.y - r - 5);
  ctx.lineTo(mouse.x, mouse.y - r + 2);
  ctx.moveTo(mouse.x, mouse.y + r - 2);
  ctx.lineTo(mouse.x, mouse.y + r + 5);
  ctx.stroke();
}

function drawHeartIcon(cx, cy, filled) {
  const s = 7;
  ctx.fillStyle = filled ? '#e05a4f' : 'rgba(224,90,79,0.25)';
  ctx.beginPath();
  ctx.moveTo(cx, cy + s * 0.7);
  ctx.bezierCurveTo(cx - s * 1.3, cy - s * 0.5, cx - s * 0.5, cy - s * 1.3, cx, cy - s * 0.35);
  ctx.bezierCurveTo(cx + s * 0.5, cy - s * 1.3, cx + s * 1.3, cy - s * 0.5, cx, cy + s * 0.7);
  ctx.closePath();
  ctx.fill();
  if (!filled) {
    ctx.strokeStyle = 'rgba(224,90,79,0.5)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

function drawDeathBanner() {
  if (!deathBanner || deathBanner.timer <= 0) return;
  const alpha = Math.max(0, Math.min(1, deathBanner.timer / Math.min(0.6, deathBanner.fadeTotal)));
  const cx = canvas.width / 2;
  const cy = canvas.height * 0.42;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.textAlign = 'center';

  ctx.font = 'bold 22px Trebuchet MS, sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillText(deathBanner.text, cx + 2, cy + 2);
  ctx.fillStyle = '#e05a4f';
  ctx.fillText(deathBanner.text, cx, cy);

  ctx.restore();
  ctx.textAlign = 'left';
}

function drawHUD() {
  const barW = 220, barH = 18;
  const bx = 16, by = 16;
  const pct = Math.max(0, player.health / player.maxHealth);

  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx - 3, by - 3, barW + 6, barH + 6);

  ctx.fillStyle = '#3a1414';
  ctx.fillRect(bx, by, barW, barH);

  const grad = ctx.createLinearGradient(bx, 0, bx + barW, 0);
  grad.addColorStop(0, '#e05a4f');
  grad.addColorStop(1, '#f0a24f');
  ctx.fillStyle = grad;
  ctx.fillRect(bx, by, barW * pct, barH);

  ctx.strokeStyle = '#efe3c9';
  ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, barW, barH);

  ctx.fillStyle = '#f4ead9';
  ctx.font = 'bold 12px Consolas, monospace';
  ctx.textAlign = 'center';
  ctx.fillText(`HP  ${Math.max(0, Math.round(player.health))} / ${player.maxHealth}`, bx + barW / 2, by + barH - 4);
  ctx.textAlign = 'left';

  // lives readout (hearts)
  for (let i = 0; i < PLAYER_MAX_LIVES; i++) {
    const hx = bx + barW + 14 + i * 20;
    const hy = by + barH / 2;
    const filled = i < player.lives;
    drawHeartIcon(hx, hy, filled);
  }

  // wave / kill progress readout
  const wy = by + barH + 12;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx - 3, wy - 3, barW + 6, 24);
  ctx.fillStyle = '#e0a458';
  ctx.font = 'bold 13px Consolas, monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`Wave ${wave}`, bx + 2, wy + 14);
  ctx.fillStyle = '#f4ead9';
  ctx.font = '12px Consolas, monospace';
  ctx.textAlign = 'right';
  const killLabel = waveState === 'active'
    ? (boss ? 'BOSS FIGHT!' : `Kills ${killsThisWave}/${killsRequired}`)
    : `Wave cleared!`;
  ctx.fillText(killLabel, bx + barW - 2, wy + 14);
  ctx.textAlign = 'left';

  // mana readout
  const my = wy + 26;
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(bx - 3, my - 3, barW + 6, 22);
  ctx.fillStyle = '#8fe3ff';
  ctx.font = 'bold 13px Consolas, monospace';
  ctx.fillText(`◆ Mana: ${player.mana}`, bx + 2, my + 13);

  if (difficultyMode !== 'normal') {
    const dDef = DIFFICULTY_DEFS.find(d => d.id === difficultyMode);
    ctx.fillStyle = dDef ? dDef.accent : '#e05a4f';
    ctx.font = 'bold 12px Consolas, monospace';
    ctx.textAlign = 'right';
    ctx.fillText(dDef ? dDef.name.toUpperCase() : '', bx + barW - 2, my + 13);
    ctx.textAlign = 'left';
  }

  if (player.invulnTimer > 0 && player.health <= 0.001) {
    // no-op guard
  }
}

requestAnimationFrame(loop);
</script>
